=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8415,cateName:"东方玄幻",firstLetter:"F",authorId:h,createTime:"2026-08-06 17:21:18",bookCover:n,authorization:o,level:a,serialStatus:a,description:"【（凡人、杀伐果断、无系统、苟道、该出手时就出手、雷霆手段！）\u003Cbr\u003E废人江无忌身怀噬灵根，灵力漏的比炼的还快，比最垃圾的杂灵根还废物百倍。\u003Cbr\u003E本以为此生只能在玄月宗做个扫地的，却意外得到上古仙器噬天鼎！\u003Cbr\u003E噬天鼎与噬灵根完美融合，将废物噬灵根化作噬灵仙根，可直接夺取他人灵根！\u003Cbr\u003E还可通过吞噬灵魂恢复力量，吞噬灵魂越多，能力越强...点石成金、变废为宝、改变灵根、提升修为只是基础，扭转乾坤、逆转生死、天地同寿更是不在话下！\u003Cbr\u003E这一次，我江无忌绝不让任何人踩在脚下！】",totalWords:135675,keyWordList:["轻松","全能","逆袭","吞噬","玄幻"],totalRecCount:a,weekRecCount:a,totalClick:285,continueRead:c,readChapterId:p,firstChapterId:p,firstChapterName:"第1章 边修边漏的灵根",firstChapterContent:"\u003Cp\u003E“你就这点力气？没吃饭吗？用力呀！”\u003C\u002Fp\u003E\u003Cp\u003E女子的声音在头顶响起，少年连忙加重些力气：“这样足够吗？陈仙子。”\u003C\u002Fp\u003E\u003Cp\u003E“ah~嗯～舒服多了～继续...”\u003C\u002Fp\u003E\u003Cp\u003E“好的陈仙子...”少年也松了口气，这仙子也太...这声音...\u003C\u002Fp\u003E\u003Cp\u003E“姐姐的脚美吗？”少年面前，美艳的女子继续开口。\u003C\u002Fp\u003E\u003Cp\u003E“...美。”\u003C\u002Fp\u003E\u003Cp\u003E“想不想尝尝看？”\u003C\u002Fp\u003E\u003Cp\u003E“陈仙子，这怕是不妥吧？”\u003C\u002Fp\u003E\u003Cp\u003E“咯咯～你叫什么来着？”\u003C\u002Fp\u003E\u003Cp\u003E女子身着青衣，坐在小河内侧的石头上，一双精致白皙的美腿膝盖相碰，裙摆向后，白嫩小巧的玉足正在享受少年手中清洗揉搓。\u003C\u002Fp\u003E\u003Cp\u003E“回陈仙子，江无忌。”\u003C\u002Fp\u003E\u003Cp\u003E听到陈仙子问话，江无忌连忙拱手低头回答。\u003C\u002Fp\u003E\u003Cp\u003E他不敢抬头，因为抬头就会看到些不该看的，大概太冒犯仙人了。\u003C\u002Fp\u003E\u003Cp\u003E但是这个仙子言行之中，也很冒犯他啊！\u003C\u002Fp\u003E\u003Cp\u003E他是这批上山入宗的杂役中，唯一一个没有修为的，就因为如此，被陈仙子带到这里，又因为走了泥路，让江无忌给她洗脚...\u003C\u002Fp\u003E\u003Cp\u003E原来，仙子的脚也会有味道。\u003C\u002Fp\u003E\u003Cp\u003E“咯咯～瞧你这慌张的样子，别怕，姐姐又不会吃人。”\u003C\u002Fp\u003E\u003Cp\u003E陈仙子看江无忌这样，俯下身来，修长手指勾起江无忌的下巴。\u003C\u002Fp\u003E\u003Cp\u003E抬头间，一个画面一闪而过，却深深烙在江无忌脑中。\u003C\u002Fp\u003E\u003Cp\u003E那是陈仙子略微敞开的衣领处，让江无忌在一瞬间大饱眼福。\u003C\u002Fp\u003E\u003Cp\u003E随后又对陈仙子软嫩的红唇一扫而过，目光缓缓上挪，对上陈仙子满含笑意的勾人眼神。\u003C\u002Fp\u003E\u003Cp\u003E双目对视间，江无忌连忙挪开眼神，不敢抬眼去看，又不禁吞了口水。\u003C\u002Fp\u003E\u003Cp\u003E“方才山下测验灵根，你是什么灵根？”\u003C\u002Fp\u003E\u003Cp\u003E陈仙子看到江无忌这怯懦的样子，嘴角微微勾起。\u003C\u002Fp\u003E\u003Cp\u003E“回陈仙子...噬灵根。”\u003C\u002Fp\u003E\u003Cp\u003E“嗯？噗嗤...”\u003C\u002Fp\u003E\u003Cp\u003E“哈哈哈哈哈哈哈，噬灵根？你这倒是比天灵根更少见呢，杂灵根的废物都比你强百倍，你这种体质，喝灵泉水都漏，还修个屁的仙？不如早点下山种地去。”\u003C\u002Fp\u003E\u003Cp\u003E陈仙子听后笑得花枝乱颤，完全是听了个天大的笑话。\u003C\u002Fp\u003E\u003Cp\u003E“...”江无忌悄悄握拳，只感屈辱。\u003C\u002Fp\u003E\u003Cp\u003E修仙者修炼以灵根为基础，越是纯粹的灵根修炼起来越是得心应手。\u003C\u002Fp\u003E\u003Cp\u003E五灵根的修士被称为杂灵根，是修仙界人人唾弃的废材。\u003C\u002Fp\u003E\u003Cp\u003E就算侥幸进入宗门也只是个看门扫地的。\u003C\u002Fp\u003E\u003Cp\u003E四灵根也没好到哪去，三灵根的还是有希望成为内门弟子的，双灵根亦是重点培养的修士，单灵根就是资质绝顶的，被称为天灵根，人人争夺的弟子。\u003C\u002Fp\u003E\u003Cp\u003E而江无忌这噬灵根很有说法。\u003C\u002Fp\u003E\u003Cp\u003E如果江无忌是个水桶，那就是个边装边漏的水桶，修炼的灵气全部都会一刻不停地自动流失...\u003C\u002Fp\u003E\u003Cp\u003E堪称废物中的废物。\u003C\u002Fp\u003E\u003Cp\u003E可他有不得不修炼的理由！\u003C\u002Fp\u003E\u003Cp\u003E三年前村中上空有仙人斗法，漫天金光之后，全村老小、父母妹妹，连个全尸都没能留下，只剩上山砍柴迷路晚归的江无忌一人。\u003C\u002Fp\u003E\u003Cp\u003E如今江无忌好不容易摸到玄月宗的山门，发誓绝不再做任人欺凌的凡人！\u003C\u002Fp\u003E\u003Cp\u003E可...噬灵根给江无忌来了个迎头痛击，三年修炼毫无起色的原因竟是因为这噬灵根。\u003C\u002Fp\u003E\u003Cp\u003E“诶呦，笑死我了。”陈仙子笑了好一会儿才停。\u003C\u002Fp\u003E\u003Cp\u003E随后把脚从水中提起，毫无顾忌地在江无忌身上擦干，而后轻点脚尖，踩着江无忌的头跃起，落在岸边鞋上。\u003C\u002Fp\u003E\u003Cp\u003E“让陈仙子见笑了...”\u003C\u002Fp\u003E\u003Cp\u003E江无忌满心屈辱却不敢言语，还要毕恭毕敬。\u003C\u002Fp\u003E\u003Cp\u003E这陈仙子的修为只有炼气五层，在玄月宗，简直如蝼蚁。\u003C\u002Fp\u003E\u003Cp\u003E但在这杂役阁的一亩三分地，身为杂役阁阁主的陈仙子就是皇帝。\u003C\u002Fp\u003E\u003Cp\u003E惹恼了陈仙子，别说玄月宗外门，就连杂役阁杂役的身份都不保。\u003C\u002Fp\u003E\u003Cp\u003E不管怎么说，好歹先进来吧？\u003C\u002Fp\u003E\u003Cp\u003E“陈仙子，我这里还有信物。”江无忌生怕陈仙子因为这个灵根赶他下山，连忙拿出一块令牌。\u003C\u002Fp\u003E\u003Cp\u003E陈仙子看到令牌上的苑字，眉头微皱：“这是苑师姐的牌子，你从哪来的？”\u003C\u002Fp\u003E\u003Cp\u003E“苑师姐？是她给我的，是她跟我说，如果有一天我想修炼，便可以拿着这块牌子来到玄月宗找她。”\u003C\u002Fp\u003E\u003Cp\u003E江无忌也是刚知道原来这个苑代表她的姓氏。\u003C\u002Fp\u003E\u003Cp\u003E苑师姐是两年前在山下时江无忌遇到的。\u003C\u002Fp\u003E\u003Cp\u003E当初她似乎身受重伤，江无忌照顾了她三天三夜，最后得了这么一块牌子。\u003C\u002Fp\u003E\u003Cp\u003E有这块牌子，他就可以踏入求仙问道的门槛了！\u003C\u002Fp\u003E\u003Cp\u003E陈仙子听后一把夺走令牌，在手中把玩，勾起嘴角看着江无忌：“这牌子给我了。”\u003C\u002Fp\u003E\u003Cp\u003E“啊？陈仙子，这怕是不妥吧！”江无忌听后瞪大眼睛，这不是抢吗！？\u003C\u002Fp\u003E\u003Cp\u003E陈仙子听到江无忌反抗，把令牌放进自己领口之间，随后抬手就是一巴掌挥他脸上。\u003C\u002Fp\u003E\u003Cp\u003E“你一个噬灵根，这辈子都不可能有宗门收你，倒不如把它给我结个善缘，姐姐我还能网开一面，留你在杂役阁当个杂役，不然，你连这山都上不来！”\u003C\u002Fp\u003E\u003Cp\u003E这一巴掌直接把江无忌打懵了，歪着头，不敢回正，他没想到刚才还一脸温和的陈仙子居然会动手扇他嘴巴。\u003C\u002Fp\u003E\u003Cp\u003E“你拿着这牌子，没人会要你，可我拿着，至少也能成为外门弟子了，以后无论何时都有姐姐我罩着你，想继续留在杂役阁就要乖乖听话，懂吗？”\u003C\u002Fp\u003E\u003Cp\u003E陈仙子伸手捧着江无忌的脸颊，把他的头回正，让江无忌直视他，语气温柔，但饱含威胁。\u003C\u002Fp\u003E\u003Cp\u003E听着陈仙子的话，江无忌起了一身鸡皮疙瘩，忙鞠躬抬手：“无忌明白，无忌谨遵陈仙子教诲。”\u003C\u002Fp\u003E\u003Cp\u003E“这就对了。”陈仙子这才重新露出笑容收回手，白了江无忌一眼：“这是你此月的五斤灵米和两枚修炼丹药，这个是杂役弟子每日要做的事情，自己看吧，丹药给你真是浪费了。”\u003C\u002Fp\u003E\u003Cp\u003E她不知从哪掏出一个竹简，和一个小盒子，一袋灵米抛给江无忌，说罢便转身走了。\u003C\u002Fp\u003E\u003Cp\u003E“那谁，过来带他熟悉一下。”陈仙子也不知对着哪喊了一声。\u003C\u002Fp\u003E\u003Cp\u003E她前脚刚走，就有个又黑又瘦的人从石头后走出，示意江无忌跟上他。\u003C\u002Fp\u003E\u003Cp\u003E江无忌看看手中的东西，虽说没能见到苑仙子，没进入外门，但好歹是留在玄月宗了。\u003C\u002Fp\u003E\u003Cp\u003E先不管什么噬灵根的，距离修仙总算是更近了一步，江无忌也抬脚跟上那黑瘦子。\u003C\u002Fp\u003E\u003Cp\u003E“所谓杂役阁，就是负责整个宗门打扫卫生的杂役弟子所在处，平时就是扫地、浇花，总之脏活累活全是我们的，陈仙子就是负责管理这一块的。”\u003C\u002Fp\u003E\u003Cp\u003E“这是洒扫工具所在地，那边是吃饭的地方，那边草屋，你的住所，这里的活要按时做完，绝对不能偷懒，会有人盯着我们，如果做不完...会死。”\u003C\u002Fp\u003E\u003Cp\u003E黑瘦子在前面带路，穿过小溪，来到杂役弟子们聚集的地方，伸手给江无忌介绍每个地方。\u003C\u002Fp\u003E\u003Cp\u003E“现在这个时辰，你自己看竹简，我们该做什么？”\u003C\u002Fp\u003E\u003Cp\u003E黑瘦子在洒扫工具前停下脚步，回头看向江无忌。\u003C\u002Fp\u003E\u003Cp\u003E江无忌连忙打开竹简：“辰时要浇灌灵田和清除杂草。”\u003C\u002Fp\u003E\u003Cp\u003E“嗯。”黑瘦子点点头，转身去拿起洒扫工具，准备去挑水干活。\u003C\u002Fp\u003E\u003Cp\u003E“愣着干什么？时间不多了，你活够了？”黑瘦子看江无忌不动，催促道。\u003C\u002Fp\u003E\u003Cp\u003E“来了！来了！”江无忌听后连忙过去用担子挑起两个桶，拿上镰刀，快步跟上黑瘦子。\u003C\u002Fp\u003E\u003Cp\u003E“你弄这边，我去那边。”黑瘦子带着江无忌来到一片灵田，给江无忌交代完就继续往前走。\u003C\u002Fp\u003E\u003Cp\u003E“师兄怎么称呼？”江无忌在后面询问一声，这也算是带自己的第一个人吧？\u003C\u002Fp\u003E\u003Cp\u003E可他的询问并没有换到回答，黑瘦子没理他，直接走了。\u003C\u002Fp\u003E\u003Cp\u003E“...仙人都这么冷漠吗？”江无忌尴尬的笑笑，没有立刻干活，而是从怀里掏出那丹药，仙丹啊！这辈子第一次见到仙丹啊。\u003C\u002Fp\u003E\u003Cp\u003E如果吃了这仙丹，能不能留下灵力呢？\u003C\u002Fp\u003E\u003Cp\u003E不疑有他，吃了才知道，江无忌直接把丹药吞下去。\u003C\u002Fp\u003E\u003Cp\u003E丹药吞下的下一刻，江无忌的瞳孔瞬间布满血丝，一股痛苦之意涌上心头，江无忌捂着自己的胸口嚎叫起来，趴在地上，感觉体内有数万只蚂蚁正在撕咬。\u003C\u002Fp\u003E\u003Cp\u003E“呃...呃...啊！好疼！好疼！”\u003C\u002Fp\u003E\u003Cp\u003E黑瘦子听到江无忌的哀嚎，回头看了他一眼，随后叹气，摇摇头，没有理会。\u003C\u002Fp\u003E\u003Cp\u003E江无忌也生生被疼晕了过去。\u003C\u002Fp\u003E\u003Cp\u003E等他再醒来时，已经是第二日清晨。\u003C\u002Fp\u003E\u003Cp\u003E“头...好疼...啊！”\u003C\u002Fp\u003E\u003Cp\u003E江无忌托着昏昏沉沉的脑袋，刚睁眼，那黑瘦子就瞪大眼睛嘴角流口水地躺在他面前！\u003C\u002Fp\u003E\u003Cp\u003E通红的眼睛吓得江无忌瞬间清醒，连忙坐在地上倒退出去几米远。\u003C\u002Fp\u003E\u003Cp\u003E“死...死了！”\u003C\u002Fp\u003E",secondChapterId:94988659,latestChapterId:95111452,latestChapterName:"第66章 抢劫抢劫的人",latestLevel:a,latestDateMsg:"2026-08-26 00:02:00",todayUpdateNum:3,mengZhuNum:a,bookBaikeId:a,naodongIndex:c,isFavorite:c,isfemale:a},authorInfo:{authorId:h,pseudonym:g,authorImage:"https:\u002F\u002Fstatic.zongheng.com\u002Fuserimage\u002F16\u002F0d\u002F160d8c8904fbaf7b53d138eedf4ba0e0V1_120_120.png",authorType:d,godMark:a,godMarkUrl:b,authorLevel:d,authorLevelUrl:"https:\u002F\u002Fstatic.zongheng.com\u002Fapp\u002Fauthorgod\u002Ftag_author_1star.png",authorBaikeId:a,hasRelationShip:c,authorBookNum:o,totalWords:1233012,authorUpdateDay:16,authorLatestWords:b,markShowType:d},needJump:c,jump:b,apkUrl:"https:\u002F\u002Fdl.zongheng.com\u002Fsrc\u002Fapk?bookId=1581938&bookName=%E5%BA%9F%E7%81%B5%E6%A0%B9%E5%9E%83%E5%9C%BE%EF%BC%9F%E5%8F%AF%E6%88%91%E5%90%9E%E5%99%AC%E5%B0%B1%E5%8F%98%E5%BC%BA%E5%95%8A%EF%BC%81",userId:a,isLogin:c,isShowDonate:i,thisMonthDonateNum:a,thisWeekRecTicketNum:a,recTicketRankNum:a,recOfDistanceRankNum:d,mtOfDistanceRankNum:d,thisMonthRankNum:a,thisMonthTicketNum:a,last1MonthNum:7,last1MonthRankNum:a,last2MonthNum:6,last2MonthRankNum:a,showNum:d,showHonor:c,last1MonthTop1:q,last1MonthTop1Id:r,last2MonthTop1:q,last2MonthTop1Id:r,isDoubleMonthTicketOpen:c,essayActivity:e,canMonthVote:i},detailChapter
