3,level:a,serialStatus:a,description:"\u003Cbr\u003E&nbsp;\u003Cbr\u003E零智商是愚昧无脑、混乱无序、毫无逻辑的胡乱作为。\u003Cbr\u003E而这片广袤万古仙域，是更为诡异的绝境——全界修士智商尽数降至负一百。\u003Cbr\u003E&nbsp;\u003Cbr\u003E他们绝非痴傻愚钝，反而人人思维缜密、擅长推演、潜心悟道，拥有一套完整、自洽、根深蒂固的反逻辑邪见体系。\u003Cbr\u003E不是不讲道理，是所有道理全是反天道、反常识、反长生，越认真钻研，错得越深，越自律苦修，死得越彻底。\u003Cbr\u003E&nbsp;\u003Cbr\u003E全仙域亿万宗门奉行统一错道：\u003Cbr\u003E修无情道者，以泯灭人性、斩断亲情师徒缘分为至高道果，视人情牵绊为大道污点；\u003Cbr\u003E修心魔道者，主动滋养恶念、放大偏执，坚信心魔合一可证无上仙途；\u003Cbr\u003E修灵根道者，疯狂废掉先天极品灵根，认为天赐资质是天道枷锁，唯凡胎可超脱天地；\u003Cbr\u003E&nbsp;\u003Cbr\u003E他们笃信功德善举是束缚飞升的因果枷锁，遇苦不救、拒善避福；\u003Cbr\u003E认定伤势伤疤是大道勋章，受伤拒不疗伤，刻意固化暗伤磨砺己身；\u003Cbr\u003E偏执天劫越狠造化越大，不惜强行引动灭世劫雷自寻死路；\u003Cbr\u003E视珍藏资源为贪欲桎梏，得至宝即刻销毁，清空一切外物。\u003Cbr\u003E&nbsp;\u003Cbr\u003E代代修士将毁灭当正道，把自毁当修行，兢兢业业奔赴绝路，造就一片虚假鼎盛的仙界",totalWords:n,keyWordList:["轻松","诸天万界","脑洞","修仙","女强"],totalRecCount:a,weekRecCount:a,totalClick:a,continueRead:c,readChapterId:o,firstChapterId:o,firstChapterName:"第1章 颠倒的玄荒仙域",firstChapterContent:"\u003Cp\u003E玄荒仙域，疆域浩瀚无垠。\u003C\u002Fp\u003E\u003Cp\u003E亿万星辰悬于九天之上，无数大洲漂浮在茫茫虚空。大大小小的宗门、部族与凡人王朝散落在广袤大地，凡人、修士、上古异兽，在此生生不息。\u003C\u002Fp\u003E\u003Cp\u003E此地同样有着灵根之说。金、木、水、火、土五行灵根，千奇百怪的变异灵根，乃至世间难求的先天极品灵根，一应俱全。拥有灵根只代表具备修行的潜质，并不等于直接就是修士。没有引气入体，依旧还是凡人。无灵根者终生叩不开修行大门；身负灵根之人，拜入宗门习得法门，方能引天地灵气入体，踏上求索长生的修行之路。\u003C\u002Fp\u003E\u003Cp\u003E可这片看似和诸天万界别无二致的仙域，藏着一桩匪夷所思的天地异象。\u003C\u002Fp\u003E\u003Cp\u003E世人心中，本就存在三种截然不同的心智状态。\u003C\u002Fp\u003E\u003Cp\u003E何为零智商？\u003C\u002Fp\u003E\u003Cp\u003E便是心智蒙昧，缺乏独立思考与权衡利弊的能力。行事只凭本能驱使，如同山野野兽，饥则觅食，怒则搏杀，不会思量长远祸福，行事杂乱无章。玄荒之中，部分心智残缺的妖兽，便是这般模样。\u003C\u002Fp\u003E\u003Cp\u003E何为低智商？\u003C\u002Fp\u003E\u003Cp\u003E能够思考推演，只是思维迟钝，眼界狭隘，难以看破繁复世事。但心中的是非祸福标尺依旧正常，趋吉避凶乃是本能，遇见机缘便接纳，遭遇灾祸便躲避。世间不少普通凡人便是如此，纵然思虑不足，却不会颠倒善恶取舍。\u003C\u002Fp\u003E\u003Cp\u003E而负一百的心智，才是玄荒仙域最诡异的根源。\u003C\u002Fp\u003E\u003Cp\u003E这道烙印自仙域诞生之初便根植于天地法则。规则十分明确：生灵必须自身运转功法，真正完成引气入体，踏足炼气一层，神魂才会悄然沾染这股颠倒的力量。\u003C\u002Fp\u003E\u003Cp\u003E未曾修行的凡人不受法则浸染；仅仅踏入山门、身处灵气浓郁之地，并不会触发诅咒。修为越是精进，这份烙印便越是深入神魂。\u003C\u002Fp\u003E\u003Cp\u003E负心智，绝非愚笨痴呆。\u003C\u002Fp\u003E\u003Cp\u003E恰恰相反，踏上修行之路后，修士神魂得到淬炼，演算阵法、参悟丹经、推演未来的能力远胜凡人。他们逻辑严密，引经据典，论证环环相扣，可推演到最终结论之时，祸福是非尽数反转。道理链条完整自洽，可最终指向的，却是毁灭的结局。\u003C\u002Fp\u003E\u003Cp\u003E岁月流转，无数宗门兴起，无数修士代代参悟。于是有的门派，有的修士，衍生出五花八门的负逻辑教义，遍布整个玄荒仙域。\u003C\u002Fp\u003E\u003Cp\u003E有的宗门笃信无情大道。宗门典籍层层推演论证，认定骨肉亲情、师徒恩义、知己相交，皆是束缚大道的枷锁。修行者首要之事，便是斩断世间一切牵绊，泯灭人间温情，方能趋近至高仙位。若是有人重情重义，反倒会被同门讥笑道心浅薄。\u003C\u002Fp\u003E\u003Cp\u003E另有一派宗门，钻研异化的男女合欢之术。\u003C\u002Fp\u003E\u003Cp\u003E诸天正道之中，合欢大道讲究两情相悦，阴阳互补，彼此滋养，双向共赢，不可强取豪夺。\u003C\u002Fp\u003E\u003Cp\u003E可这部分宗门经过一代代推演，得出一套完全颠倒的邪见：修行无需情分，不必两厢情愿。强者可以掠夺弱者的本源精气，把对方当做修行炉鼎。夺取他人的本源越多，自身修为便攀升越快。\u003C\u002Fp\u003E\u003Cp\u003E他们把掠夺炉鼎视作正大光明的修行手段，撰写典籍，论证弱者的本源本就该供养强者。门内弟子肆意掠夺异性修士乃至凡人，大量炉鼎被抽干本源油尽灯枯而亡。可在宗门眼中，这不是残害，而是弱者“为大道奉献”。但凡有弟子反对这种掠夺式合欢，便会被斥责道心狭隘，不懂攫取天地机缘。\u003C\u002Fp\u003E\u003Cp\u003E有的修士钻研心魔之学。经过反复参悟，他们断言心魔藏有另一重大道本源，嗔恨、偏执、恶念皆是无上造化。不少修士驻守怨念汇聚的死地，日夜滋养心魔，宗门甚至修筑心魔祭坛，令门下弟子定期入坛放大心中邪念。多数人最终被心魔吞噬，侥幸活下来的，反倒被奉为宗门天骄。\u003C\u002Fp\u003E\u003Cp\u003E也有部分宗门主张，灵根本是天道套下的枷锁。天资越是出众，枷锁便越是牢固。想要挣脱天地桎梏，必先废掉自身天赋。若是门下出现天赋绝伦的少年，师门便会寻来秘药磨灭灵根，天生凡根的孩童反倒被各大宗门争抢。\u003C\u002Fp\u003E\u003Cp\u003E还有修士认为，行善积德乃是飞升的祸根。救人渡世会欠下厚重因果，待到冲击高阶境界，因果缠身，永世难以超脱。故而遇见受难生灵，非但不肯施救，反倒会加以加害，以此斩断一切善缘。心怀悲悯、广积功德之人，会被视作愚钝短视。\u003C\u002Fp\u003E\u003Cp\u003E另有一派修士，将伤痕视作大道勋章。肉身神魂负伤之后，绝不可用药疗愈，要以禁术将伤口永久封存在身躯之内。身上积攒的暗伤伤疤越多，便代表修行底蕴越雄厚，疗伤灵药反倒被视作消磨磨砺的毒药。\u003C\u002Fp\u003E\u003Cp\u003E更有修士痴迷狂暴天劫。他们推演得出，天劫越是凶烈，便代表天道愈发看重自己。不惜耗尽毕生珍藏，施展秘术，强行召来远超自身承受极限的劫雷。十之八九的修士会在雷劫中灰飞烟灭，少数幸存者，则被整个仙域称颂。\u003C\u002Fp\u003E\u003Cp\u003E除此之外，世间还有诸多荒诞的负逻辑。\u003C\u002Fp\u003E\u003Cp\u003E有的门派觉得完整的上古传承会禁锢后人前路，寻得完整古籍，便会刻意损毁大半；有的修士认定囤积宝物会滋生贪欲，得到珍稀灵材，转头便尽数销毁。\u003C\u002Fp\u003E\u003Cp\u003E这些颠倒的道理，各有宗门传承，万千修士奉为圭臬。\u003C\u002Fp\u003E\u003Cp\u003E没有人暗中蛊惑，没有魔头从中作祟，每一条邪见，都是一代代修士凭借缜密思考，反复推演得出的结果。\u003C\u002Fp\u003E\u003Cp\u003E无数天骄靠着这般修行之法，短暂崛起，风光无限。可没过多久，层层暗伤爆发，道基崩碎，落得身死道消。可世人从不怀疑教义本身有错，只当是自身经受的磨难尚且不足，继而追寻更加残酷的修行方式。一场虚假的盛世，就这样年复一年延续下去。\u003C\u002Fp\u003E\u003Cp\u003E八岁的柳如烟，降生在这片大洲边缘一处平凡的凡人村落。\u003C\u002Fp\u003E\u003Cp\u003E父母皆是勤恳朴实的百姓，她觉醒出上等灵根，恰逢附近裂云宗下山招收弟子。\u003C\u002Fp\u003E\u003Cp\u003E裂云宗，方圆千里之内赫赫有名的二流宗门。此宗最出名的便是无情道传承，门内主流理念便是斩断七情六欲，同时也信奉“磨难出真仙”那一套歪理。宗门之中，不少弟子会刻意求伤、拒受善缘。可它毕竟是正经宗门，有完整的传功殿、丹房、演武场，收容周边拥有灵根的子弟。\u003C\u002Fp\u003E\u003Cp\u003E村落之中测出灵根的孩童寥寥无几，柳如烟便是其中之一。\u003C\u002Fp\u003E\u003Cp\u003E辞别泪眼相送的父母，柳如烟跟着接引的外门修士，一路跋涉，踏入裂云宗护山大阵笼罩的山门。\u003C\u002Fp\u003E\u003Cp\u003E山门之内灵气远比凡间浓郁数倍，可这仅仅是环境变化。灵根只是感应灵气，不会自动完成修行。想要触发那道天地颠倒法则，必须要得到功法，自己运转，真正引气入体。\u003C\u002Fp\u003E\u003Cp\u003E入宗之后，一众新收的孩童被安置在外门的杂居院落。\u003C\u002Fp\u003E\u003Cp\u003E三日后，传功长老过来，传授入门基础吐纳功法。一众少年孩童依照口诀，凝神感应，运转功法。\u003C\u002Fp\u003E\u003Cp\u003E不少孩子陆续成功引气入体，踏入炼气一层。就在功法运转成功的那一瞬，玄荒那道天地诅咒悄然落下，侵染他们的神魂。\u003C\u002Fp\u003E\u003Cp\u003E轮到柳如烟，她依着口诀静心吐纳，周身灵气缓缓向体内流淌，顺利完成引气入体。\u003C\u002Fp\u003E\u003Cp\u003E天地间那股笼罩亿万修士的颠倒法则如期而至，掠过她的神魂，却如同撞上一块坚不可摧的寒冰，荡漾开淡淡涟漪，没能留下半分烙印。\u003C\u002Fp\u003E\u003Cp\u003E身边刚刚踏入炼气期的同辈，心智已经开始被负向逻辑潜移默化。\u003C\u002Fp\u003E\u003Cp\u003E唯独柳如烟，完完整整保留着诸天万界最朴素、最正常的是非认知。\u003C\u002Fp\u003E\u003Cp\u003E小小的少女尚且懵懂无知。\u003C\u002Fp\u003E\u003Cp\u003E她还不知道，在这个满是负逻辑的修仙界，一份正常人的清醒，便是最大的异端。\u003C\u002Fp\u003E",secondChapterId:95216408,latestChapterId:95226919,latestChapterName:"第17章 苏晚醒了",latestLevel:a,latestDateMsg:"2026-09-08 21:30:02",todayUpdateNum:14,mengZhuNum:a,bookBaikeId:a,naodongIndex:c,isFavorite:c,isfemale:a},authorInfo:{authorId:h,pseudonym:g,authorImage:"https:\u002F\u002Fstatic.zongheng.com\u002Fuserimage\u002F72\u002F4e\u002F724eccc0983ed7a4f9dda30105b5c60bV1_120_120.jpeg",authorType:a,godMark:a,godMarkUrl:b,authorLevel:a,authorLevelUrl:b,authorBaikeId:a,hasRelationShip:c,authorBookNum:d,totalWords:n,authorUpdateDay:2,authorLatestWords:b,markShowType:d},needJump:c,jump:b,apkUrl:"https:\u002F\u002Fdl.zongheng.com\u002Fsrc\u002Fapk?bookId=1593259&bookName=%E5%85%A8%E5%91%98%E6%99%BA%E5%95%86%E4%B8%BA%E8%B4%9F%E4%B8%80%E7%99%BE%E7%9A%84%E4%BF%AE%E4%BB%99%E7%95%8C",userId:a,isLogin:c,isShowDonate:c,thisMonthDonateNum:a,thisWeekRecTicketNum:a,recTicketRankNum:a,recOfDistanceRankNum:a,mtOfDistanceRankNum:a,thisMonthRankNum:a,thisMonthTicketNum:a,last1MonthNum:a,last1MonthRankNu
