死了，你父母也死在了遗迹之中，那你还有什么资格享受这老宅？”\u003C\u002Fp\u003E\u003Cp\u003E林东没有反驳。\u003C\u002Fp\u003E\u003Cp\u003E想起之前的战斗，二叔为了保护他，惨遭黑衣人杀害，连他自己也被震碎真元，废了修为，他心中无比愤怒。\u003C\u002Fp\u003E\u003Cp\u003E联想起整件事情的经过，他感觉这就是个阴谋。\u003C\u002Fp\u003E\u003Cp\u003E看着林东的样子，林天不屑地笑道。\u003C\u002Fp\u003E\u003Cp\u003E“我说的还不够明白吗？林家要重新选举族长，你这个废物少主自然也要换掉，你……”\u003C\u002Fp\u003E\u003Cp\u003E呸！\u003C\u002Fp\u003E\u003Cp\u003E没等对方说完，林东直接吐了一口血水，喷了林天一脸。\u003C\u002Fp\u003E\u003Cp\u003E林天眼睛微微眯起，伸手擦掉脸上的血水，他甩手就是一巴掌。\u003C\u002Fp\u003E\u003Cp\u003E啪！\u003C\u002Fp\u003E\u003Cp\u003E林东被打了一个趔趄，一头栽倒在地。\u003C\u002Fp\u003E\u003Cp\u003E林天上前一步，一把抓住林雪的脖子，并且将其提了起来。\u003C\u002Fp\u003E\u003Cp\u003E小丫头双手抓住林天的手臂，小腿一阵乱蹬。\u003C\u002Fp\u003E\u003Cp\u003E倒在地上的林东看到此情此景，眼珠子瞬间变得通红，他支撑着身体就要爬起来。\u003C\u002Fp\u003E\u003Cp\u003E嘭！\u003C\u002Fp\u003E\u003Cp\u003E可是林天根本就没给他机会，一脚踩在他的脑袋上，直接踩进土里。\u003C\u002Fp\u003E\u003Cp\u003E“你个废物的狗东西，居然敢吐我？今天我就让你吃土，我还会让你看着这小丫头死，让你看着身边所有人都离你而去，你会是一个什么样的表情，哈哈哈……”\u003C\u002Fp\u003E\u003Cp\u003E林东此刻感觉无法呼吸，本能的驱使下，用双手用力抓住林天的脚，想要将其挪开。\u003C\u002Fp\u003E\u003Cp\u003E可却无法做到。\u003C\u002Fp\u003E\u003Cp\u003E而被抓住脖子的林雪，眼看着哥哥受辱，眼泪都流下来了。\u003C\u002Fp\u003E\u003Cp\u003E她松开一只小手，在头发上抓出一根金簪，对着林天的手臂，狠狠地刺了下去。\u003C\u002Fp\u003E\u003Cp\u003E噗！啊！\u003C\u002Fp\u003E\u003Cp\u003E林天吃痛，直接松开了林雪。\u003C\u002Fp\u003E\u003Cp\u003E小丫头摔在地上都没喊疼，低着头就向着林天撞了过去。\u003C\u002Fp\u003E\u003Cp\u003E嘭！\u003C\u002Fp\u003E\u003Cp\u003E嗷呜！\u003C\u002Fp\u003E\u003Cp\u003E小丫头的个头刚好适中，一头撞在了林天的脆弱之处，这家伙一声惨叫，顿时趔趄着倒退。\u003C\u002Fp\u003E\u003Cp\u003E扑通！\u003C\u002Fp\u003E\u003Cp\u003E可他的脚还被林东抓着呢，顿时脚下不稳，一屁股坐在地上。\u003C\u002Fp\u003E\u003Cp\u003E而此刻的林东终于抓住机会，他拼尽全身的力气，一下子蹿起，抓起地上的一把匕首，向着林天要害刺下。\u003C\u002Fp\u003E\u003Cp\u003E林天顾不得疼痛，就地一滚，躲开了林东致命一击。\u003C\u002Fp\u003E\u003Cp\u003E可林东哪里会放过这么好的机会，再次一跃，骑在了对方的身上，匕首已经横在林天的脖子上。\u003C\u002Fp\u003E\u003Cp\u003E这突如其来的变化，让周围的护卫全都措手不及。\u003C\u002Fp\u003E\u003Cp\u003E当他们反应过来的时候，林东已经得手了。\u003C\u002Fp\u003E\u003Cp\u003E“谁敢动一下，我就杀了他！”\u003C\u002Fp\u003E\u003Cp\u003E林东愤怒地嘶吼，刀刃划破了林天的皮肤，鲜血瞬间流下。\u003C\u002Fp\u003E\u003Cp\u003E现在的林天没有丝毫的反抗之力，他只感觉肚子里扭着劲儿地疼，手臂上还扎着一根金簪，脖子上的匕首，更是让他感觉到了生死危机。\u003C\u002Fp\u003E\u003Cp\u003E他万万没想到，事情会发展成这样。\u003C\u002Fp\u003E\u003Cp\u003E他明明已经占据了主动，甚至可以随时杀了这兄妹二人，可竟然在最后一刻，被林东翻盘了。\u003C\u002Fp\u003E\u003Cp\u003E“让他们都给我退后！”林东继续吼道。\u003C\u002Fp\u003E\u003Cp\u003E这些护卫都不知所措。\u003C\u002Fp\u003E\u003Cp\u003E林东立刻加重了手上的力度，林天鲜血崩现，只要那匕首再进一步，他就完了。\u003C\u002Fp\u003E\u003Cp\u003E林天带着哭腔喊道：“你们都是死人吗？按他说的做，快点！”\u003C\u002Fp\u003E\u003Cp\u003E不仅如此，林天还劝林东道：“东哥，你小心一些，我其实是跟你们闹着玩儿的，你放开我，我保证不会伤害你们，立马离开。”\u003C\u002Fp\u003E\u003Cp\u003E呵！\u003C\u002Fp\u003E\u003Cp\u003E林东一声冷笑，说出这种天真的话，真不知道是谁傻？\u003C\u002Fp\u003E\u003Cp\u003E他薅着林天的头发，刀架在后者的脖子上，然后缓缓站起。\u003C\u002Fp\u003E\u003Cp\u003E他的想法很简单，带着妹妹立刻离开林家，这里已经待不下去了。\u003C\u002Fp\u003E\u003Cp\u003E嘭！\u003C\u002Fp\u003E\u003Cp\u003E可就在此时，一道身影刹那间接近，更是有一股强悍的真元爆发，林东直接被轰飞，摔倒在远处，鲜血狂喷。\u003C\u002Fp\u003E\u003Cp\u003E他趴在地上，瞪着这突如其来的身影，愤怒地吼道。\u003C\u002Fp\u003E\u003Cp\u003E“大长老！你好卑鄙！”\u003C\u002Fp\u003E\u003Cp\u003E看到大长老，林东全明白了。\u003C\u002Fp\u003E\u003Cp\u003E林天敢如此胡作非为，身为其爷爷的大长老，才是幕后黑手。\u003C\u002Fp\u003E\u003Cp\u003E此刻的林雪抬头看了一眼，一口咬在大长老的手上。\u003C\u002Fp\u003E\u003Cp\u003E哼！\u003C\u002Fp\u003E\u003Cp\u003E大长老一声冷哼，直接将林雪甩了出去，摔倒在林东旁边。\u003C\u002Fp\u003E\u003Cp\u003E林东看到妹妹摔倒，想要爬过去，可是他现在连这点力气都没有了。\u003C\u002Fp\u003E\u003Cp\u003E“我杀了你！”\u003C\u002Fp\u003E\u003Cp\u003E此时，林天终于缓过来，他抢过护卫手中的长刀，一刀向着林东的脑袋劈去。\u003C\u002Fp\u003E\u003Cp\u003E眼看着凛冽的刀锋临近，林东不甘地闭上了眼睛。\u003C\u002Fp\u003E\u003Cp\u003E“天儿！”\u003C\u002Fp\u003E\u003Cp\u003E不料，大长老却阻止了林天。\u003C\u002Fp\u003E\u003Cp\u003E“他还不能死，在少主接任仪式上，必须有他出现，不过，你可以在仪式上亲手斩杀他。”\u003C\u002Fp\u003E\u003Cp\u003E听到爷爷这么说，林天狠狠地说道：“那就让他多活几日！”\u003C\u002Fp\u003E\u003Cp\u003E“大管家，这两个人就交给你处理。”大长老说完，便带人离去。\u003C\u002Fp\u003E\u003Cp\u003E听到这句话，林东再也坚持不住，晕了过去。\u003C\u002Fp\u003E\u003Cp\u003E他是连气带伤，又被大长老重击，只剩半条命了。\u003C\u002Fp\u003E\u003Cp\u003E也不知过了多久，林东感觉到了寒冷，他的眼皮颤抖，费了好大劲才睁开了眼睛。\u003C\u002Fp\u003E\u003Cp\u003E眼前的景物渐渐清晰，他看到了一个露天的房顶，片片洁白的雪花从破洞处落了下来。\u003C\u002Fp\u003E\u003Cp\u003E他身上血迹斑斑，肚子上的血洞已经不再流血，他腰间的少主令牌也被鲜血染红了。\u003C\u002Fp\u003E\u003Cp\u003E这副凄惨的模样，任谁也想不到，半个月前，他还是林家高高在上的少主。\u003C\u002Fp\u003E\u003Cp\u003E嘎吱！\u003C\u002Fp\u003E\u003Cp\u003E就在这个时候，柴房的门被推开了.\u003C\u002Fp\u003E\u003Cp\u003E洁白的雪花吹进来，带着一股寒气涌入柴房。\u003C\u002Fp\u003E\u003Cp\u003E林东打了个哆嗦，立刻回过神来。\u003C\u002Fp\u003E\u003Cp\u003E他看到妹妹林雪小脸冻得通红，正努力地关上门。\u003C\u002Fp\u003E\u003Cp\u003E然后跑到他近前，蹲下身，从怀里拿出两个冰凉的馒头。\u003C\u002Fp\u003E\u003Cp\u003E小丫头嘴唇都裂了，小手也冻得通红。\u003C\u002Fp\u003E\u003Cp\u003E好像是因为奔跑，有些气喘吁吁，哆哆嗦嗦地将馒头送到林东的面前。\u003C\u002Fp\u003E\u003Cp\u003E“哥，你吃！吃了好有力气。”\u003C\u002Fp\u003E\u003Cp\u003E看着眼前的妹妹，林东的眼中涌现泪花。\u003C\u002Fp\u003E\u003Cp\u003E林雪才十岁，还没开始修炼的她，就是一个普通人，却跟着他一起受苦。\u003C\u002Fp\u003E\u003Cp\u003E林东心中不忍。\u003C\u002Fp\u003E\u003Cp\u003E想当初，他的父亲是林家第一强者，也是族长。\u003C\u002Fp\u003E\u003Cp\u003E而林东作为其长子自然不弱，十岁开始习武修炼，十二岁已经修炼到初武境九重巅峰。\u003C\u002Fp\u003E\u003Cp\u003E十五岁便成功凝聚真元，晋升到真武境，这在望云城已经是天才了。\u003C\u002Fp\u003E\u003Cp\u003E半月前，望云城之外突然出现一处遗迹，他的父亲带着亲卫前往，神秘失踪。\u003C\u002Fp\u003E\u003Cp\u003E数天后，母亲带人寻找，然后也杳无音信。\u003C\u002Fp\u003E\u003Cp\u003E三天前，他只身一人去寻找父母的踪迹，结果寻找了两天两夜，没有丝毫结果。\u003C\u002Fp\u003E\u003Cp\u003E最终，还差点被一个蒙面的强者斩杀。\u003C\u002Fp\u003E\u003Cp\u003E好在他的二叔及时赶到，救下了他，却因此送了性命。\u003C\u002Fp\u003E\u003Cp\u003E他的父母失踪，二叔身死，他们这一支一下子就没落了。\u003C\u002Fp\u003E\u003Cp\u003E在大家族之中，这种没落代表的就是灭亡。\u003C\u002Fp\u003E\u003Cp\u003E他现在唯一的用处，就是一个月后的少主接任仪式上，成为林天的踏脚石。\u003C\u002Fp\u003E\u003Cp\u003E他恨！\u003C\u002Fp\u003E\u003Cp\u003E不但恨！他甚至想过死！\u003C\u002Fp\u003E\u003Cp\u003E可是现在看到妹妹的样子，他的想法变了，他要活下去。\u003C\u002Fp\u003E\u003Cp\u003E他要找到父母，生要见人，死要见尸。\u003C\u002Fp\u003E\u003Cp\u003E他还要找到那个蒙面人，为二叔报仇。\u003C\u002Fp\u003E\u003Cp\u003E他还要把妹妹抚养长大，要让她过上好日子。\u003C\u002Fp\u003E\u003Cp\u003E于是，他强忍着泪水，挣扎着坐了起来。\u003C\u002Fp\u003E\u003Cp\u003E抬手摸了摸林雪的脑袋，说道：“我知道馒头的另一种吃法，你想不想试试？”\u003C\u002Fp\u003E\u003Cp\u003E“嗯！雪儿想试试！”\u003C\u002Fp\u003E\u003Cp\u003E林雪乖巧地点点头，还吞了下口水，想来是饿了。\u003C\u002Fp\u003E\u003Cp\u003E林东虽然是少主，可他并不养尊处优。\u003C\u002Fp\u003E\u003Cp\u003E相反，什么事情都做在前头，甚至还能掌管林家各个商铺的经营。\u003C\u002Fp\u003E\u003Cp\u003E所以，在林家，以前的他颇有些威望，可是现在呢？\u003C\u002Fp\u003E\u003Cp\u003E他摇了摇头，忍痛起来生火。\u003C\u002Fp\u003E\u003Cp\u003E柴房中有的是柴火，他把两个冰凉的馒头穿起来，放在火上烤了起来。\u003C\u002Fp\u003E\u003Cp\u003E有了火焰的照耀，屋子里也不那么冷了。\u003C\u002Fp\u003E\u003Cp\u003E兄妹二人都是饿极了，完全被食物的香味吸引。\u003C\u002Fp\u003E\u003Cp\u003E他们都没有注意到，因为火焰的烘烤，林东腰间的那块少主令牌就好像寒冰解冻一样，褪去了原本的模样，正在散发着淡淡的光辉。\u003C\u002Fp\u003E\u003Cp\u003E其上的血液竟然快速的消失，就连林东衣服上的血液也在向其汇聚。\u003C\u002Fp\u003E\u003Cp\u003E并且有一股暖洋洋的感觉，自林东的腰间扩散至全身。\u003C\u002Fp\u003E\u003Cp\u003E不过这种感觉，比火焰烘烤的感觉要弱上很多，所以，林东并未察觉到。\u003C\u002Fp\u003E\u003Cp\u003E渐渐地，馒头上冒出了热气，表面更是被烤得金黄。\u003C\u002Fp\u003E\u003Cp\u003E“哇！好香啊！哥，这一定很好吃吧！”林雪搓着通红的小手，一边咽着口水，一边说道。\u003C\u002Fp\u003E\u003Cp\u003E听到妹妹的话，林东心头猛地一揪。\u003C\u002Fp\u003E\u003Cp\u003E半个月前，妹妹还是一个无忧无虑的孩子，不说山珍海味，但也是锦衣玉食。\u003C\u002Fp\u003E\u003Cp\u003E可是现在……却说一个烤馒头香，想来是饿坏了。\u003C\u002Fp\u003E\u003Cp\u003E林东明白，在自己昏迷的这段时间里，妹妹肯定吃了不少苦。\u003C\u002Fp\u003E\u003Cp\u003E他紧紧地攥着拳头，转头时，原本狰狞的脸上已经挂着微笑。\u003C\u002Fp\u003E\u003Cp\u003E他将烤好的馒头递给林雪，说道：“小心烫！”\u003C\u002Fp\u003E\u003Cp\u003E“呼呼呼！”\u003C\u002Fp\u003E\u003Cp\u003E林雪使劲地吹了吹，咬了一口馒头。\u003C\u002Fp\u003E\u003Cp\u003E咔哧！\u003C\u002Fp\u003E\u003Cp\u003E吃到热乎的烤馒头，林雪眼睛都笑成了月牙，“真好吃！”\u003C\u002Fp\u003E\u003Cp\u003E林东伸手摸着林雪的小脑袋瓜，眼中瞳孔一缩。\u003C\u002Fp\u003E\u003Cp\u003E借着火光，他清楚地看到，林雪的脸上有一个红红的巴掌印。\u003C\u002Fp\u003E\u003Cp\u003E刚才因为冻得通红，没有发现，现在被火一烤，那掌印清晰地浮现出来。\u003C\u002Fp\u003E\u003Cp\u003E林东深吸口气，淡淡的问道：“雪儿，是谁打得你？”\u003C\u002Fp\u003E\u003Cp\u003E林雪毕竟是一个孩子，她先是一愣，然后捂住了自己的脸颊，支吾着说道：“哥，是我不小心撞的，一点都不疼，你快吃馒头吧！”\u003C\u002Fp\u003E\u003Cp\u003E凭借林东对妹妹的了解，她一定是受到了威胁，在担心着什么才撒谎的。\u003C\u002Fp\u003E\u003Cp\u003E于是他低沉地说道：“雪儿，我昏迷的这段时间，你应该也知道发生了什么。\u003C\u002Fp\u003E\u003Cp\u003E我知道，你很害怕，但是你要相信哥哥，我有能力保护你。\u003C\u002Fp\u003E\u003Cp\u003E爹娘只是失踪了，并没有死，所以，只要我们离开这个林家，就一定能够找到他们。\u003C\u002Fp\u003E\u003Cp\u003E在这段时间里，你要听我的话，知道吗？”\u003C\u002Fp\u003E\u003Cp\u003E听到这些，林雪终于忍不住，哇的一声哭了出来，她承受了这个年纪不应该有的压力，此刻终于得到释放。\u003C\u002Fp\u003E\u003Cp\u003E“他们说哥哥已经是废物了，要是我不听话，他们就要杀死哥哥，我害怕失去哥哥，呜呜……”\u003C\u002Fp\u003E\u003Cp\u003E林东一把抱住了林雪，泪水在眼眶中打转。\u003C\u002Fp\u003E\u003Cp\u003E不过他并没有哭出来，而是咬了咬牙，安慰着说道：“哥哥不会死，哥哥会带你去找爹娘，现在告诉我，是谁打了你？”\u003C\u002Fp\u003E\u003Cp\u003E林雪的心理防线终于破了，她断断续续地说道：“哥哥昏迷的那段时间，我害怕极了。\u003C\u002Fp\u003E\u003Cp\u003E他们抢了我们的房子，还把昏迷不醒的哥哥拖到了这个柴房，我去拿药他们不给，去拿吃的他们也不给。”\u003C\u002Fp\u003E\u003Cp\u003E“后来，我实在太饿了，就去厨房偷偷拿了两个馒头。\u003C\u002Fp\u003E\u003Cp\u003E被王贵抓住了，他不但不给，还对我动手动脚，想要摸我……我把他的脸抓花了，他就打我！”\u003C\u002Fp\u003E\u003Cp\u003E吸！\u003C\u002Fp\u003E\u003Cp\u003E林东深吸口气，压制了一下心中熊熊燃烧的怒火。\u003C\u002Fp\u003E\u003Cp\u003E真是墙倒众人推，连一个下人都能欺负他们了。\u003C\u002Fp\u003E\u003Cp\u003E可林东现在的状态，别说讨回公道，哪怕是想站起来，都很费劲。\u003C\u002Fp\u003E\u003Cp\u003E不过他还是双手扶着林雪那稚嫩的肩膀，沉声说道：“雪儿不怕，从现在起，一切都交给哥哥。\u003C\u002Fp\u003E\u003Cp\u003E我要让他们付出代价，谁敢打你，我就让他死！”\u003C\u002Fp\u003E\u003Cp\u003E“我听哥哥的！”懂事的林雪用力点头，开始吃起了烤馒头。\u003C\u002Fp\u003E\u003Cp\u003E林东眼中光芒闪动，无端发怒只会让他失去理智，只有冷静下来，才能险中取胜。\u003C\u002Fp\u003E\u003Cp\u003E如今的处境已经很明显，他们兄妹必须走出林家，才有活下去的希望。\u003C\u002Fp\u003E\u003Cp\u003E咣当！\u003C\u002Fp\u003E\u003Cp\u003E还没等林东想明白，柴房的门突然被踹开了。\u003C\u002Fp\u003E\u003Cp\u003E伴随着风雪，有几道人影迈步走了进来。\u003C\u002Fp\u003E\u003Cp\u003E林东一步就挡在林雪的身前，冷冷的看着来人。\u003C\u002Fp\u003E\u003Cp\u003E“呦！这还是我们的少主吗？竟然落魄到这种地步，臭要饭的都比你强啊！”\u003C\u002Fp\u003E\u003Cp\u003E林东是真没想到，说话的人正是王贵。\u003C\u002Fp\u003E\u003Cp\u003E仇人相见，分外眼红！\u003C\u002Fp\u003E\u003Cp\u003E可是林东现在力量尽失，面对这些人，根本没有胜算。\u003C\u002Fp\u003E",secondChapterId:69722040,latestChapterId:70562826,latestChapterName:"第787章 生命尽头，新的篇章",latestLevel:c,latestDateMsg:"2022-11-30 09:46:45",todayUpdateNum:a,mengZhuNum:a,bookBaikeId:a,naodongIndex:d,isFavorite:d,isfemale:a},authorInfo:{authorId:i,pseudonym:h,authorImage:"https:\u002F\u002Fstatic.zongheng.com\u002Fuserimage\u002F44\u002F51\u002F445103c3af116d81716d6a909fb885aeV1_120_120.jpeg",authorType:c,godMark:a,godMarkUrl:b,authorLevel:j,authorLevelUrl:"https:\u002F\u002Fstatic.zongheng.com\u002Fapp\u002Fauthorgod\u002Ftag_author_3stars.png",authorBaikeId:a,hasRelationShip:d,authorBookNum:j,totalWords:12858076,authorUpdateDay:a,authorLatestWords:b,markShowType:c},needJump:d,jump:b,apkUrl:"https:\u002F\u002Fdl.zongheng.com\u002Fsrc\u002Fapk?bookId=1237782&bookName=%E7%8B%82%E8%A1%80%E5%
