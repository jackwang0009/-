=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8415,cateName:"东方玄幻",firstLetter:"X",authorId:h,createTime:"2022-09-15 08:44:20",bookCover:n,authorization:4,level:a,serialStatus:d,description:"叶凡穿越玄幻世界，成为无极宗藏剑峰峰主！\u003Cbr\u003E\u003Cbr\u003E随他一起穿越的，还有脑海里的一些特殊人格。\u003Cbr\u003E\u003Cbr\u003E这些人格在他脑海里，整日吵闹不休，\u003Cbr\u003E\u003Cbr\u003E“有我安澜便有天的安澜！”\u003Cbr\u003E\u003Cbr\u003E“独断万古的叶天帝！”\u003Cbr\u003E\u003Cbr\u003E“吾以炎帝之名，敕令天下万火，听本帝号令！”\u003Cbr\u003E\u003Cbr\u003E“重瞳本是无敌路，何须再借他人骨！”\u003Cbr\u003E\u003Cbr\u003E“自古顺天者，为天地之宠儿，这宠儿的背后，却是蝼蚁之身！”\u003Cbr\u003E\u003Cbr\u003E“谁在称无敌，哪个敢言不败？帝落时代都不见……”\u003Cbr\u003E\u003Cbr\u003E随着一个个人格，不断在叶凡脑海中复苏。\u003Cbr\u003E\u003Cbr\u003E他不知道的是。\u003Cbr\u003E\u003Cbr\u003E她的那位无极女帝，却也觉醒了模拟人生系统。\u003Cbr\u003E\u003Cbr\u003E当这位无极女帝，将模拟对象对准叶凡的时候，终于发现了自己这位峰主大恐怖的人生！",totalWords:986082,keyWordList:["热血","爽文","争霸","升级","搞笑"],totalRecCount:a,weekRecCount:a,totalClick:2834,continueRead:c,readChapterId:o,firstChapterId:o,firstChapterName:"第1章 人麻了，玩个锤子！",firstChapterContent:"\u003Cp\u003E灵武世界！\u003C\u002Fp\u003E\u003Cp\u003E“人麻了，穿越了穿越了。”\u003C\u002Fp\u003E\u003Cp\u003E“但TM金手指都没有，玩个锤子！”\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E\u003Cp\u003E战天峰上，无极殿！\u003C\u002Fp\u003E\u003Cp\u003E鸟语花香，无数的珍禽异兽四处飞舞，四处仙气化作的云朵在宫殿上方飘散。\u003C\u002Fp\u003E\u003Cp\u003E宫殿内部，更是金碧恢弘，四根刻有上古四大神兽的巨大支柱支撑着穹顶，穹顶上更是有刻满龙凤，恍若回到上古时代被龙凤统治的世界一般。\u003C\u002Fp\u003E\u003Cp\u003E宽阔的殿堂中央，一名外美丽的女子盘膝而坐，略微翘起的鼻梁，薄薄的嘴唇上散发着迷人的风采，一头长发更是四处飘逸。\u003C\u002Fp\u003E\u003Cp\u003E此人正是无极宫的主人，无极女帝。\u003C\u002Fp\u003E\u003Cp\u003E此刻的女帝，虽然英姿勃发，但早已到了垂暮之年，\u003C\u002Fp\u003E\u003Cp\u003E无他，只因无极魔功的反噬导致他已经时日不多。\u003C\u002Fp\u003E\u003Cp\u003E“就此离去，并非本宫之愿，只因这无极宗还缺一个真正能够带领它走向光明的引路人。”\u003C\u002Fp\u003E\u003Cp\u003E一想到自己这一逝去，过往岁月中被自己镇压的那些号称五大仙门，四大圣地的九大圣子将会依靠着自己所在的宗门圣地欺压而来。\u003C\u002Fp\u003E\u003Cp\u003E除此之外，还有曾经被自己给打的支离破碎的十大隐世家族即将虎视眈眈。\u003C\u002Fp\u003E\u003Cp\u003E无极女帝忧心忡忡。\u003C\u002Fp\u003E\u003Cp\u003E她这一生，自上任掌门手中结果无极宗以来，树敌太多。但这也是她在这个世界上唯一放不下的牵挂。\u003C\u002Fp\u003E\u003Cp\u003E不仅凭借女子之身走到现在的境界，更是打得无数强者在她面前以晚辈自居。\u003C\u002Fp\u003E\u003Cp\u003E以至于到现在孤家寡人一个，没有太多朋友。\u003C\u002Fp\u003E\u003Cp\u003E正当他苦苦沉思之际，忽然想到昨日修炼之时莫名多出来的教统模拟器，无极女帝伸手挽起一缕秀发。再次限入沉思之中。\u003C\u002Fp\u003E\u003Cp\u003E“其中天道气息如此浓郁，又不像此方世界的宝物，怪哉怪哉！”\u003C\u002Fp\u003E\u003Cp\u003E如果让灵武世界里的任何人人知道堂堂无极女帝居然被一件不知名的异宝扰乱心神，必然会大惊失色。\u003C\u002Fp\u003E\u003Cp\u003E………………\u003C\u002Fp\u003E\u003Cp\u003E与此同时，无极宗，藏剑峰，峰主大殿外面。\u003C\u002Fp\u003E\u003Cp\u003E比起其他峰的人来人往，藏剑峰却是格外的清冷。\u003C\u002Fp\u003E\u003Cp\u003E只见峰峦秀丽之间，只有一个少年坐在上面看着远处的景色。\u003C\u002Fp\u003E\u003Cp\u003E他正是叶凡。\u003C\u002Fp\u003E\u003Cp\u003E十年前就穿越到了这个世界，便是在那时，藏剑峰上下尽皆战死于虚空之海。\u003C\u002Fp\u003E\u003Cp\u003E而他，藏剑峰的上一任峰主求着无极女帝吴清絮留下来的种子，也是藏剑峰的峰主。\u003C\u002Fp\u003E\u003Cp\u003E因此，他成了无极宗最年轻的峰主，也是修为最拉胯的峰主。\u003C\u002Fp\u003E\u003Cp\u003E比起其他峰主早已能够独当一面，就算不是战圣，战斗力也能跟战圣掰掰手腕。\u003C\u002Fp\u003E\u003Cp\u003E而他，只是一个战宗境界的小虾米。\u003C\u002Fp\u003E\u003Cp\u003E修行一界，分为战士，战灵，战宗，战候，战王，战圣，战皇，战神。\u003C\u002Fp\u003E\u003Cp\u003E战神早已存在于传说之中。\u003C\u002Fp\u003E\u003Cp\u003E下方空无一人。\u003C\u002Fp\u003E\u003Cp\u003E“内卷啊，果然无处不在。”\u003C\u002Fp\u003E\u003Cp\u003E“穿越了还能被卷起来，我真的栓Q！”\u003C\u002Fp\u003E\u003Cp\u003E正当叶凡沉思之时，一个莫名的声音出现在他的脑海之中。\u003C\u002Fp\u003E\u003Cp\u003E“我说你小子，还在这里苟着，早点出去干架他不香吗？”\u003C\u002Fp\u003E\u003Cp\u003E叶凡早已少见多怪，只是淡淡的回答道：\u003C\u002Fp\u003E\u003Cp\u003E“这不，还没到时候吗？急什么？”\u003C\u002Fp\u003E\u003Cp\u003E那声音继续吐槽道：\u003C\u002Fp\u003E\u003Cp\u003E“切，怂就是怂，哪来那么多破借口？”\u003C\u002Fp\u003E\u003Cp\u003E叶凡见自己的真实想法被看穿之后，也不多言：“怂点怎么了？不怂的都死在了虚空之海。”\u003C\u002Fp\u003E\u003Cp\u003E狠人大帝见叶凡懒得搭理自己，随即不再多言。\u003C\u002Fp\u003E\u003Cp\u003E但叶凡知道，肯定是去找叶天帝打嘴仗去了。\u003C\u002Fp\u003E\u003Cp\u003E没错，他穿越之后带了一个名为名为道统模拟的系统，可惜的是系统暂时无法开启。\u003C\u002Fp\u003E\u003Cp\u003E但每融合一个脑海里出现的狠人的时候，都会给一些奖励。\u003C\u002Fp\u003E\u003Cp\u003E融合叶天帝的时候什么什么也没有，融合狠人大帝的时候给的是黑玉战神断续膏，就说万物都可粘连。\u003C\u002Fp\u003E\u003Cp\u003E融合荒天帝的时候给的是一把战神裤衩，据说万物都可砍。\u003C\u002Fp\u003E\u003Cp\u003E但，每隔一段时间就能听到自己脑子里莫名出现的声音。\u003C\u002Fp\u003E\u003Cp\u003E荒天帝，狠人大帝，还有叶天帝都出现过了。\u003C\u002Fp\u003E\u003Cp\u003E每次出现总是那么的突兀，从一开始叶凡会被吓道，直道现在的淡然，早已经习以为常了。\u003C\u002Fp\u003E\u003Cp\u003E而他也不仅只是能够听到声音那么简单，更重要的是还能使用几人的各种神通妙法。\u003C\u002Fp\u003E\u003Cp\u003E再加上自己在灵武世界学会的一些技能，他会的东西可谓是五花八门，用一句话来说就是：啥都会点！\u003C\u002Fp\u003E\u003Cp\u003E“我说你小子，出去转转呗，不就干架吗？死了再重生一次不就可以了吗？”\u003C\u002Fp\u003E\u003Cp\u003E叶凡在心里白了他一眼道：“你老人家还没去找叶天帝干仗啊？”\u003C\u002Fp\u003E\u003Cp\u003E“不去，你学了那么多东西，就龟缩在这样一个小山峰上，你倒是出去啊，废物，怂货！”\u003C\u002Fp\u003E\u003Cp\u003E叶凡听着对方一顿数落，摸了摸鼻子：“我也想出去啊，但我怕我一去就成了没了，而且这劳什子系统到现在还没有一点动静。”\u003C\u002Fp\u003E\u003Cp\u003E狠人大帝沉默了一会儿，继续吐槽道：\u003C\u002Fp\u003E\u003Cp\u003E“早晚都要出去的，你就早点出去，正好也让我们知道一下这方世界到底是什么实力。”\u003C\u002Fp\u003E\u003Cp\u003E“不去，我怕！”叶凡坚定的说道。\u003C\u002Fp\u003E\u003Cp\u003E狠人大帝也不知道该说什么，沉默了良久，只得微微一叹。\u003C\u002Fp\u003E\u003Cp\u003E半晌之后。\u003C\u002Fp\u003E\u003Cp\u003E“纵使我背负天渊，还需一手托起原始帝城，有我安澜便有天！”\u003C\u002Fp\u003E\u003Cp\u003E“这里是哪儿？为何我会在这里？”\u003C\u002Fp\u003E\u003Cp\u003E一道声音莫名出现在叶凡的脑海之中，叶凡知道，有新人来了。\u003C\u002Fp\u003E\u003Cp\u003E但——\u003C\u002Fp\u003E\u003Cp\u003E为何是他？\u003C\u002Fp\u003E\u003Cp\u003E叶凡满脸黑线！\u003C\u002Fp\u003E\u003Cp\u003E“小子，这是哪儿？”安澜的声音再次出现在叶凡的脑海之中，隔着屏幕，叶凡都能感觉得到那一脸的傲气。\u003C\u002Fp\u003E\u003Cp\u003E“欢迎来到德莱——不，我的世界！”\u003C\u002Fp\u003E\u003Cp\u003E“小子，颂我真名，轮回中得见永生！”安澜清楚眼前的状况之后，对叶凡说道。\u003C\u002Fp\u003E\u003Cp\u003E叶凡苦笑：“那我还不如跟荒天帝混！”\u003C\u002Fp\u003E\u003Cp\u003E“啊~这！”安澜问道。\u003C\u002Fp\u003E\u003Cp\u003E“你别这么说，当时安澜已经引起我的注意了！”荒天帝！\u003C\u002Fp\u003E\u003Cp\u003E“那可不，这一出场，我就知道是谁了！”叶天帝！\u003C\u002Fp\u003E\u003Cp\u003E“你是谁？怎么如此熟悉？”安澜听到叶天帝的声音，便问道。\u003C\u002Fp\u003E\u003Cp\u003E“还记得万物母气鼎吗？”叶天帝提醒了一句。\u003C\u002Fp\u003E\u003Cp\u003E“你~”安澜表示有被气到。\u003C\u002Fp\u003E\u003Cp\u003E叶凡只是笑了笑，随即开始融合安澜的神通妙法。\u003C\u002Fp\u003E",secondChapterId:70057636,latestChapterId:70760854,latestChapterName:"第106章 击杀妖魔真身（完结）",latestLevel:a,latestDateMsg:"2022-12-31 01:40:01",todayUpdateNum:a,mengZhuNum:a,bookBaikeId:a,naodongIndex:c,isFavorite:c,isfemale:a},authorInfo:{authorId:h,pseudonym:g
