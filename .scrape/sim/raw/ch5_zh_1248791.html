更好，这种废物留着也是浪费资源。”\u003C\u002Fp\u003E\u003Cp\u003E“唉……也不知道以秦瑶学姐那种绝世天才当初是怎么看上他的。”\u003C\u002Fp\u003E\u003Cp\u003E“秦瑶学姐被誉为江南市第一天才，仅用了一年的时间就已经是一位三品宗师了，更是觉醒了血脉天赋，被副院长收为关门弟子，地位可谓是一人之下万人之上，未来的成就最低都是武将，甚至武王。”\u003C\u002Fp\u003E\u003Cp\u003E“是啊，武王，整个江南市一共才两个。”\u003C\u002Fp\u003E\u003Cp\u003E一名学生赞叹一声，眼中闪烁着向往和崇拜的目光。\u003C\u002Fp\u003E\u003Cp\u003E接着，他又朝场中央瞥了一眼，表情瞬间转为不屑，冷嘲道：\u003C\u002Fp\u003E\u003Cp\u003E“不过好在秦瑶学姐有先见之明，早早就和姜凡分手了，要不然得让这废物拖累死。”\u003C\u002Fp\u003E\u003Cp\u003E“就是，以秦瑶学姐那种天人之姿，也只有京都的那种大家族才配得上。”\u003C\u002Fp\u003E\u003Cp\u003E“……”\u003C\u002Fp\u003E\u003Cp\u003E听着无数的人指指点点，冷嘲热讽。\u003C\u002Fp\u003E\u003Cp\u003E场中央上的少年，似乎并不在意。\u003C\u002Fp\u003E\u003Cp\u003E那帅气俊美的脸庞上，有的只是一种不知所措的茫然。\u003C\u002Fp\u003E\u003Cp\u003E什么鬼？\u003C\u002Fp\u003E\u003Cp\u003E上一秒还吹着空调，在峡谷中浴血奋战，怎么突然就穿越了？\u003C\u002Fp\u003E\u003Cp\u003E他皱着眉头，\u003C\u002Fp\u003E\u003Cp\u003E开始努力地去消化脑海中陌生的记忆。\u003C\u002Fp\u003E\u003Cp\u003E令人惊讶的是，\u003C\u002Fp\u003E\u003Cp\u003E身体的原主人竟然与他同名，都叫姜凡。\u003C\u002Fp\u003E\u003Cp\u003E渐渐地，他对这个世界有了一个大概的了解。\u003C\u002Fp\u003E\u003Cp\u003E这是一个和蓝星类似的平行世界。\u003C\u002Fp\u003E\u003Cp\u003E与之不同的是，在这个世界上，每个人都可以修行武道，成为武者。\u003C\u002Fp\u003E\u003Cp\u003E武者，修行内劲气血，觉醒血脉天赋，可日行万里，身如山岳，挥手之间斩断江河大海，镇压一切。\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E\u003Cp\u003E至于身体的原主人。\u003C\u002Fp\u003E\u003Cp\u003E父母双亡，从小在孤儿院长大，\u003C\u002Fp\u003E\u003Cp\u003E并且，在成长的过程中结识了秦瑶，两人可以算得上是青梅竹马。\u003C\u002Fp\u003E\u003Cp\u003E姜凡与秦瑶，极其聪颖，对于武道一途有着不俗的理解力。\u003C\u002Fp\u003E\u003Cp\u003E高考的时候，两人分别以第一名第二名的优异理论成绩，考入了江南市最顶级的武道学院。\u003C\u002Fp\u003E\u003Cp\u003E尤其是秦瑶，\u003C\u002Fp\u003E\u003Cp\u003E刚入学一个星期就修出内劲，成为了准武者，破格进入精英班。\u003C\u002Fp\u003E\u003Cp\u003E一个月肉身力量破千斤，内劲外放，顺利突破武者，从而引发学院的关注，开始重点培养。\u003C\u002Fp\u003E\u003Cp\u003E至此……\u003C\u002Fp\u003E\u003Cp\u003E秦瑶的武道之路，一发不可收拾，短短一年的时间成为了一名武道宗师。\u003C\u002Fp\u003E\u003Cp\u003E18岁的宗师，别说江南市了，就算整个大夏国都不多见。\u003C\u002Fp\u003E\u003Cp\u003E但姜凡就不同了，\u003C\u002Fp\u003E\u003Cp\u003E一年的时间，\u003C\u002Fp\u003E\u003Cp\u003E无论姜凡怎么修炼，一丝内劲也修炼不出来，\u003C\u002Fp\u003E\u003Cp\u003E甚至最基础的锻体都无法做到。\u003C\u002Fp\u003E\u003Cp\u003E也正因为如此，秦瑶越来越对姜凡失望，两人最终分道扬镳，形同陌路。\u003C\u002Fp\u003E\u003Cp\u003E一个天，一个地，\u003C\u002Fp\u003E\u003Cp\u003E形成了鲜明的对比。\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E\u003Cp\u003E捋清了记忆之后，\u003C\u002Fp\u003E\u003Cp\u003E姜凡的眼皮不由得抽搐了一下，\u003C\u002Fp\u003E\u003Cp\u003E这……\u003C\u002Fp\u003E\u003Cp\u003E逆风开局？\u003C\u002Fp\u003E\u003Cp\u003E不！\u003C\u002Fp\u003E\u003Cp\u003E天崩都不为过。\u003C\u002Fp\u003E\u003Cp\u003E记忆中，武道学院内，每个月都会进行一次武者测试，\u003C\u002Fp\u003E\u003Cp\u003E尤其是新生，入学第一年，必须要通过准武者测试，否则便会被学院开除。\u003C\u002Fp\u003E\u003Cp\u003E成为准武者，需要修出内劲，肉身力量需要达到300公斤。\u003C\u002Fp\u003E\u003Cp\u003E而这幅身体，天赋差的让人难以置信，\u003C\u002Fp\u003E\u003Cp\u003E最高一次考核记录，仅仅118公斤，就连一些普通人都比不上。\u003C\u002Fp\u003E\u003Cp\u003E今天的武者测试，也是他入学来最后一次机会，若他无法达到准武者的标准，只能回家当个普通人。\u003C\u002Fp\u003E\u003Cp\u003E“这算什么事啊！”\u003C\u002Fp\u003E\u003Cp\u003E姜凡心里充满无奈。\u003C\u002Fp\u003E\u003Cp\u003E在这个实力为尊，凶兽遍地的世界上，\u003C\u002Fp\u003E\u003Cp\u003E一个毫无地位的普通人，如草芥蝼蚁一般，根本难以存活下去。\u003C\u002Fp\u003E\u003Cp\u003E“姜凡，你在发什么呆，还不快测试。”\u003C\u002Fp\u003E\u003Cp\u003E这时，\u003C\u002Fp\u003E\u003Cp\u003E一道不耐烦的声音，打断了他的思绪。\u003C\u002Fp\u003E\u003Cp\u003E姜凡回过神，抬头看了一眼自己面前的胖男人。\u003C\u002Fp\u003E\u003Cp\u003E周大海，他的班主任。\u003C\u002Fp\u003E\u003Cp\u003E在姜凡刚刚进入学院的时候，周大海的态度那是一个好，整日对他嘘寒问暖，生怕他受委屈。\u003C\u002Fp\u003E\u003Cp\u003E可是随着姜凡表现出的废人天赋，\u003C\u002Fp\u003E\u003Cp\u003E周大海仿佛是换了一个人，开始对他冷漠，不耐烦，厌恶，甚至同班里的学生一样，变相的嘲讽他，更三番四次的找他麻烦。\u003C\u002Fp\u003E\u003Cp\u003E若不是学院规定学生有一年的考核期，恐怕早就将他开除了。\u003C\u002Fp\u003E\u003Cp\u003E“还真是人情冷暖、世态炎凉啊。”\u003C\u002Fp\u003E\u003Cp\u003E姜凡苦笑的摇了摇头，心里自嘲了一句。\u003C\u002Fp\u003E\u003Cp\u003E“算了，安心当个普通人也罢。”\u003C\u002Fp\u003E\u003Cp\u003E自我安慰了一句后，\u003C\u002Fp\u003E\u003Cp\u003E他走到旁边的力量测试碑上。\u003C\u002Fp\u003E\u003Cp\u003E然而……\u003C\u002Fp\u003E\u003Cp\u003E就在他伸出胳膊，准备要挥拳的时候。\u003C\u002Fp\u003E\u003Cp\u003E一道古井无波的机械声忽然在脑海中响起。\u003C\u002Fp\u003E\u003Cp\u003E【叮！恭喜宿主觉醒修仙模拟器。】\u003C\u002Fp\u003E\u003Cp\u003E【修仙模拟器：可生成虚拟修仙世界，模拟宿主在修仙世界中的人生经历，并将虚拟修仙世界中的部分奖励具现反馈给宿主。】\u003C\u002Fp\u003E\u003
