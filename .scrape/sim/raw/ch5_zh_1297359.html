=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8353,cateName:"幻想修真",firstLetter:"W",authorId:h,createTime:"2022-09-13 21:08:01",bookCover:n,authorization:4,level:a,serialStatus:d,description:"上极宗外门弟子叶辰，因资质差的缘故而被同门欺凌，某次下山历练，死于凶兽之手。\u003Cbr\u003E“我不甘！我不甘心！…”\u003Cbr\u003E同一时间，平行宇宙另外一名少年灵魂穿梭：重生叶辰之躯，少年誓要报仇！\u003Cbr\u003E这时，叶辰脑中响起一道声音：\u003Cbr\u003E【叮！修仙模拟器已激活！……】\u003Cbr\u003E【检测主角灵根为五行废灵根，是否消耗1500灵气进行提升……】\u003Cbr\u003E【主角境界较低，当达到筑基期后将开启永无休止的自动修炼……】\u003Cbr\u003E……\u003Cbr\u003E激活修仙模拟器，开启自动修炼！\u003Cbr\u003E自此以后，叶辰走向无敌。\u003Cbr\u003E“打架吗？我无敌，你们随意啊！”",totalWords:o,keyWordList:["热血","杀伐果断","弃少","仙侠","爽文"],totalRecCount:a,weekRecCount:a,totalClick:174,continueRead:c,readChapterId:p,firstChapterId:p,firstChapterName:"第1章 灵魂重生，激活修仙模拟器！",firstChapterContent:"\u003Cp\u003E“他，他不会有事吧？”\u003C\u002Fp\u003E\u003Cp\u003E“好，好像死了……”\u003C\u002Fp\u003E\u003Cp\u003E“不会吧？？”\u003C\u002Fp\u003E\u003Cp\u003E“全是血……”\u003C\u002Fp\u003E\u003Cp\u003E青叶林深处，五个身穿灰色玄袍的少年围在一起，目光深邃，神色紧张。\u003C\u002Fp\u003E\u003Cp\u003E在他们身前，地上趴着一个人，和他们相同大的年龄，也穿着相同的衣服。\u003C\u002Fp\u003E\u003Cp\u003E只不过，这名少年的身下一片鲜血染红，后背的衣服也全都被撕烂了。\u003C\u002Fp\u003E\u003Cp\u003E衣服撕烂的大口子，背上显露出血红色的爪子印，左看右看都像是被某只凶兽给袭击了。\u003C\u002Fp\u003E\u003Cp\u003E“慌什么！”\u003C\u002Fp\u003E\u003Cp\u003E这时，站在最前面的那个少年开口了，目光中透着不屑，说话也带着冷意。\u003C\u002Fp\u003E\u003Cp\u003E“就他这种废物，死了就死了。有什么好可惜的？”\u003C\u002Fp\u003E\u003Cp\u003E“我原本以为，他至少能扛下剑齿魔狼一击，但没想到他竟然这么弱。”\u003C\u002Fp\u003E\u003Cp\u003E“不过他死的也值！为我们扛下一击，一命换五命……”\u003C\u002Fp\u003E\u003Cp\u003E“值了！”\u003C\u002Fp\u003E\u003Cp\u003E说完，他竟是哈哈大笑了起来，然后扭头就走。\u003C\u002Fp\u003E\u003Cp\u003E其他人都相互看了一眼，也急忙跟了上去，没有人去管地上的那具尸体了。\u003C\u002Fp\u003E\u003Cp\u003E人群中，自然是有胆小的，就问：“李师兄，他死了，我们回去怎么交代啊？”\u003C\u002Fp\u003E\u003Cp\u003E有人就跟着附和：“是啊！他毕竟是外门弟子。如今他出了事，我们回去后要怎么跟言掌座说呢？”\u003C\u002Fp\u003E\u003Cp\u003E“言掌座虽然对他严厉，但是打心底里很是照顾他。如今他死在外面，言掌座定然愤怒。要是查出来，我们会不会有事啊？”\u003C\u002Fp\u003E\u003Cp\u003E姓李的少年就笑道：“该怎么交代就怎么交代。他技不如人，怪得了谁？至于言掌座，那就让他查呗！查出来又如何？他也不敢对我怎么样！我李家，可不怕他！…于我而言，不过是少了个打杂的奴隶罢了。也不亏！”\u003C\u002Fp\u003E\u003Cp\u003E“奴隶嘛！……”\u003C\u002Fp\u003E\u003Cp\u003E“再找就是了！”\u003C\u002Fp\u003E\u003Cp\u003E不一会儿，五人就没影了。\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E\u003Cp\u003E“咳咳！咳咳！”\u003C\u002Fp\u003E\u003Cp\u003E叶青感觉自己睡了好久，于朦胧中看见了一丝白色的光芒，如同一只手将他从黑暗中拉起。\u003C\u002Fp\u003E\u003Cp\u003E等他睁开眼时，发现自己身处一片林子当中。\u003C\u002Fp\u003E\u003Cp\u003E刺眼的光芒，从树叶缝隙间落下，使他神情恍惚。\u003C\u002Fp\u003E\u003Cp\u003E他此时正趴在地上，感觉自己浑身不是很舒服，便扭了下头，用尽力气让自己站起来。\u003C\u002Fp\u003E\u003Cp\u003E起来后，却是发现自己身下有一滩血，比杀了一头猪还要恐怖。\u003C\u002Fp\u003E\u003Cp\u003E看着自身狼狈不堪的模样：披头散发，破烂衣裳，血染衣襟，他顿时有些不知所措。\u003C\u002Fp\u003E\u003Cp\u003E“我这是怎么了？”\u003C\u002Fp\u003E\u003Cp\u003E“我不是在学校吗？”\u003C\u002Fp\u003E\u003Cp\u003E“在学校等人……”\u003C\u002Fp\u003E\u003Cp\u003E他摸了下头，仔细回想：\u003C\u002Fp\u003E\u003Cp\u003E“我记得，我在学校等女友放学，然后，然后天突然就下雨了，我躲在了树底下……”\u003C\u002Fp\u003E\u003Cp\u003E“刚拿出手机，准备上王者，接着，一道雷就落了下来……”\u003C\u002Fp\u003E\u003Cp\u003E回忆到此处，他瞬间恍然，整个人张大了嘴巴，足足能塞下一个鸡蛋：\u003C\u002Fp\u003E\u003Cp\u003E“不会吧！！”\u003C\u002Fp\u003E\u003Cp\u003E“我被雷劈了！”\u003C\u002Fp\u003E\u003Cp\u003E他清楚地记得，他原本是要接女朋友放学的，但没想到天突然就下雨了，然后就躲在了树底下。\u003C\u002Fp\u003E\u003Cp\u003E等得无聊，就拿出手机，想要打几把游戏熬一下时间……接着，就被雷劈了！\u003C\u002Fp\u003E\u003Cp\u003E“不是吧？”\u003C\u002Fp\u003E\u003Cp\u003E“怎么可能会发生这种事情？”\u003C\u002Fp\u003E\u003Cp\u003E他感觉到不可思议。\u003C\u002Fp\u003E\u003Cp\u003E被雷劈这种概率问题，几十亿人中怕也只会有一个人遇上吧？\u003C\u002Fp\u003E\u003Cp\u003E而且还是很倒霉的情况下！\u003C\u002Fp\u003E\u003Cp\u003E“居然被我遇上了？”\u003C\u002Fp\u003E\u003Cp\u003E“我也没发誓啊！……”\u003C\u002Fp\u003E\u003Cp\u003E良久，他也是接受了这样的一个事实。心里直呼还好，毕竟自己现在还活着，这就足够了。\u003C\u002Fp\u003E\u003Cp\u003E然就在这时，大量信息就像是电脑复制文件一样，疯狂一般地涌进了他的脑海中。\u003C\u002Fp\u003E\u003Cp\u003E“叶辰！把衣服给我洗了！……”\u003C\u002Fp\u003E\u003Cp\u003E“洗的不干净！拿去重新洗！再洗的不干净，就别怪我不客气！”\u003C\u002Fp\u003E\u003Cp\u003E“怎么？还在修炼啊？有天赋的人，修炼如同喝茶。像你这种，资质不怎么样，还是废灵根，就算再怎么修炼，也不会有什么好成就。也比不上我！哈哈哈哈……”\u003C\u002Fp\u003E\u003Cp\u003E“哟哟，这是谁啊？这不是外门的那个废柴吗？怎么今天却是上杂役这来了？我们这里，可是放不下你这一尊大神啊！哈哈哈哈……”\u003C\u002Fp\u003E\u003Cp\u003E“哈哈哈哈！”\u003C\u002Fp\u003E\u003Cp\u003E无穷无尽地记忆，如同被寒冰包裹的河流，在叶青的脑子里来回地游荡，使得其痛苦地抱头乱颤。\u003C\u002Fp\u003E\u003Cp\u003E最终，这些记忆与叶青融合了一体，而他脑中那些痛苦在此刻也就渐渐消散了。\u003C\u002Fp\u003E\u003Cp\u003E“叶辰……”\u003C\u002Fp\u003E\u003Cp\u003E叶青声带颤抖。\u003C\u002Fp\u003E\u003Cp\u003E他知道，这些记忆是生前这个人的，自己重生在了他的身上，所以才会自动继承这些记忆。\u003C\u002Fp\u003E\u003Cp\u003E原来，从那道雷落下的一刻，自己就已经死了？\u003C\u002Fp\u003E\u003Cp\u003E然后重生，灵魂跨时空穿越，穿越到了这个名叫叶辰的少年身上？\u003C\u002Fp\u003E\u003Cp\u003E不可思议！真是太不可思议了！\u003C\u002Fp\u003E\u003Cp\u003E“只是……”\u003C\u002Fp\u003E\u003Cp\u003E这个叶辰，生前好苦啊！\u003C\u002Fp\u003E\u003Cp\u003E“叶辰，上极宗外门弟子，但因为资质较差，是废灵根，所以被同门师兄弟看不起。又因为他脾气好、善良、老实，就把他当作奴隶一样的使唤。但他从未放弃，一心想要修炼，但最终无济于事。入门差不多两年，可依旧是练气三阶……”\u003C\u002Fp\u003E\u003Cp\u003E“同门中，那个叫李阳的最是欺负他。使唤他洗衣服、打杂、当炮灰……”\u003C\u002Fp\u003E\u003Cp\u003E“这次下山历练，就是因为李阳推了他一把，让他挡在最前头，被剑齿魔狼杀死。”\u003C\u002Fp\u003E\u003Cp\u003E死的时候，还能看见叶辰那绝望的眼神，嘴唇蠕动着：“我不甘！我不甘心……”\u003C\u002Fp\u003E\u003Cp\u003E之前发生的一幕幕，在叶青脑海中浮现，渐渐地，他的目光变得冰冷，眼中丝毫不隐藏着杀意。\u003C\u002Fp\u003E\u003Cp\u003E“李阳！……”\u003C\u002Fp\u003E\u003Cp\u003E“今日你害我，来日，我定要你血债血偿！”\u003C\u002Fp\u003E\u003Cp\u003E“叶辰，没关系。你生前被人欺凌，被人害死，所有的仇，都由我来给你报！”\u003C\u002Fp\u003E\u003Cp\u003E“从今天起，我就是叶辰！”\u003C\u002Fp\u003E\u003Cp\u003E想到这，他双拳紧紧握住，眼神坚定，望着地上那一滩血迹，下定了誓要报仇的决心。\u003C\u002Fp\u003E\u003Cp\u003E【叮！修仙模拟器已激活！……】\u003C\u002Fp\u003E\u003Cp\u003E【开始加载修仙页面……】\u003C\u002Fp\u003E\u003Cp\u003E就在这时，叶辰脑海中响起了机械般的女声，接着，在他面前就出现了一个透明的蓝色面板。\u003C\u002Fp\u003E\u003Cp\u003E面板上写着‘加载中’三个字。\u003C\u002Fp\u003E\u003Cp\u003E静等加载条走完，蓝色面板上出现了一些信息。\u003C\u002Fp\u003E\u003Cp\u003E【姓名：叶辰】\u003C\u002Fp\u003E\u003Cp\u003E【性别：男】\u003C\u002Fp\u003E\u003Cp\u003E【年龄：17岁】\u003C\u002Fp\u003E\u003Cp\u003E【修炼：2年】\u003C\u002Fp\u003E\u003Cp\u003E【宗门：上极宗】\u003C\u002Fp\u003E\u003Cp\u003E接着，在这些信息的下方，还有两条信息横向排列。\u003C\u002Fp\u003E\u003Cp\u003E【境界】：练气三阶，300修为，待升级。\u003C\u002Fp\u003E\u003Cp\u003E【肉身】：凡人之躯一阶，1000修为，待升级。\u003C\u002Fp\u003E\u003Cp\u003E中间的位置，是一个金色的小人盘腿坐着，看不清样貌，只给了一个背影。\u003C\u002Fp\u003E\u003Cp\u003E但是，他周身灵气飘浮，就像是一缕白烟，漂浮中缓缓向其丹田汇聚。\u003C\u002Fp\u003E\u003Cp\u003E其身下，也有几行字：\u003C\u002Fp\u003E\u003Cp\u003E【开始修炼】（按钮）。\u003C\u002Fp\u003E\u003Cp\u003E【总修为】：10。\u003C\u002Fp\u003E\u003Cp\u003E【筑基期开启永无休止的自行修炼！】\u003C\u002Fp\u003E\u003Cp\u003E“这是？……”\u003C\u002Fp\u003E\u003Cp\u003E看到这么一个面板凭空出现在自己面前，叶辰顿时就愣住了。\u003C\u002Fp\u003E\u003Cp\u003E好久，他才反应过来。\u003C\u002Fp\u003E\u003Cp\u003E修仙模拟器？\u003C\u002Fp\u003E\u003Cp\u003E难道这就是传说中的金手指？\u003C\u002Fp\u003E\u003Cp\u003E想到这里，他眼前一亮。\u003C\u002Fp\u003E\u003Cp\u003E这种比较玄幻的东西，没想到竟然真的存在？\u003C\u002Fp\u003E\u003Cp\u003E先是灵魂穿越，异界重生，然后，金手指就降临了！\u003C\u002Fp\u003E\u003Cp\u003E“修仙模拟器……”\u003C\u002Fp\u003E\u003Cp\u003E“回想一下，我那个世界似乎就有这么一个修真的游戏呢！我以前还玩过！游戏面板，与这个面板很相似。可以通过模拟器，来进行人物修炼、炼丹、炼器等等。而且还可以开启自动修炼权限，一觉醒来，修为突破地停不下来！”\u003C\u002Fp\u003E\u003Cp\u003E有了修仙模拟器，就相当于有了这个修仙界的GM啊！\u003C\u002Fp\u003E\u003Cp\u003E开挂神器！完胜所有修真者！\u003C\u002Fp\u003E\u003Cp\u003E有了这个东西，别说是报仇了，就是成为修仙界的无敌大佬，那也是动动手指的功夫啊！\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E",secondChapterId:74636147,latestChapterId:74637006,latestChapterName:"第180章 前因后果，算个清楚！",latestLevel:a,latestDateMsg:"2023-06-03 18:34:58",todayUpdateNum:a,mengZhuNum:a,bookBaikeId:a,naodongIndex:c,isFavorite:c,isfemale:a},authorInfo:{authorId:h,pseudonym:g,authorImage:"https:\u002F\u002Fstatic.zongheng.com\u002Fuserimage\u002F6d\u002Fe4\u002F6de4127a95dfa93b0a1798d0504afb43V1_120_120.jpeg",authorType:d,godMark:a,godMarkUrl:b,authorLevel:d,authorLevelUrl:"https:\u002F\u002Fstatic.zongheng.com\u002Fapp\u002Fauthorgod\u002Ftag_author_1star.png",authorBaikeId:a,hasRelationShip:c,authorBookNum:d,totalWords:o,authorUpdateDay:a,authorLatestWords:b,markShowType:d},needJump:c,jump:b,apkUrl:"https:\u002F\u002Fdl.zongheng.com\u002Fsrc\u002Fapk?bookId=1297359&bookName=%E6%88%91%E6%9C%89%E4%BF%AE%E4%BB%99%E6%A8%A1%E6%8B%9F%E5%99%A8%EF%BC%8C%E5%BC%80%E5%90%AF%E8%87%AA%E5%8A%A8%E4%BF%AE%E7%82%BC",userId:a,isLogin:c,isShowDonate:i,thisMonthDonateNum:a,thisWeekRecTicketNum:a,recTicketRankNum:a,recOfDistanceRankNum:d,mtOfDistanceRankNum:d,thi
