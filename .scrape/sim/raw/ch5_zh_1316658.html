=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8477,cateName:"都市高武",firstLetter:"H",authorId:h,createTime:"2024-01-18 18:25:07",bookCover:n,authorization:4,level:b,serialStatus:b,description:"林牧穿越到一个灵气复苏，人可为神的武者世界，可在这弱肉强食的武者世界中，林牧却是是一个天资地下的废材，幸亏模拟人生系统姗姗来迟。\u003Cbr\u003E系统不会缺席，只会迟到！\u003Cbr\u003E从此林牧神游万世，修尽诸天万界至高绝学，吊打各路天骄，斩神如屠狗！",totalWords:o,keyWordList:["灵气复苏","爽文","修仙","全球","扮猪吃虎"],totalRecCount:12,weekRecCount:a,totalClick:339,continueRead:d,readChapterId:p,firstChapterId:p,firstChapterName:"系统只会迟到，从不缺席！",firstChapterContent:"\u003Cp\u003E大夏，邑城。\u003C\u002Fp\u003E\u003Cp\u003E一处老式的小区房屋内。\u003C\u002Fp\u003E\u003Cp\u003E一名相貌清秀，看起来约莫十七八岁左右的少年，正百无聊赖地躺在床上，一脸的颓废之相，给人一种生无可恋的感觉。\u003C\u002Fp\u003E\u003Cp\u003E“诶，好不容易穿越一次，没有金手指也就算了，为什么气血值也这么低？一点修炼天赋都没有，难道这就是穿越者的待遇？”\u003C\u002Fp\u003E\u003Cp\u003E少年长叹一声，哀莫大于心死。\u003C\u002Fp\u003E\u003Cp\u003E他名为林牧，是从地星过来的穿越者。\u003C\u002Fp\u003E\u003Cp\u003E如今他所处这个世界名为天玄宙，发展轨迹与地星有些许类似，但又完全不同。\u003C\u002Fp\u003E\u003Cp\u003E这里是灵气复苏、异兽横行，以武为尊的世界，高科技文明技术虽然发达，但也只是帮助普通人成为强大武者的助力罢了。\u003C\u002Fp\u003E\u003Cp\u003E想要在这个世界享受最高的特权，拥有无尽的荣耀，只有成为至强的武者。\u003C\u002Fp\u003E\u003Cp\u003E本以为终于轮到自己成为穿越者，可以大展身手一次，却被现实给予了沉重的一击。\u003C\u002Fp\u003E\u003Cp\u003E没有金手指的同时，武道天赋还低得可怜\u003C\u002Fp\u003E\u003Cp\u003E不管怎么修炼，气血值都低得可怕，根本没有成为武者的希望。\u003C\u002Fp\u003E\u003Cp\u003E一辈子……\u003C\u002Fp\u003E\u003Cp\u003E只能成为一个普通的不能再普通的人，无缘去往那高处。\u003C\u002Fp\u003E\u003Cp\u003E“明天就是高考体测了，若是此次体测无法过关，就彻底无缘武道高考，只能专心文科。”\u003C\u002Fp\u003E\u003Cp\u003E“可这个世界，万般皆下品，惟有武道高！读书……并不是一条好的出路！”\u003C\u002Fp\u003E\u003Cp\u003E林牧深吸一口气，目光中带着不甘之色。\u003C\u002Fp\u003E\u003Cp\u003E如果可以，没有人会想要碌碌无为的度过一辈子，且这个世界武道为上，阶级划分鲜明，人分为三六九等。\u003C\u002Fp\u003E\u003Cp\u003E不成武者，始终都是底层。\u003C\u002Fp\u003E\u003Cp\u003E且这个世界灵气复苏，世界各地异兽横行，有不知多少危险潜伏着，人们朝不保夕，随时都有可能死去。\u003C\u002Fp\u003E\u003Cp\u003E唯有掌握武道，成为实力强大的武者，才能将命运抓在手中，才有希望将生死抓在手中！\u003C\u002Fp\u003E\u003Cp\u003E正当林牧思考之时。\u003C\u002Fp\u003E\u003Cp\u003E兜里的手机却发出一道消息提示音，随后则是一长串的密集声音，显然是有他较为关注的群聊突然开始活跃。\u003C\u002Fp\u003E\u003Cp\u003E他掏出手机，打开一看。\u003C\u002Fp\u003E\u003Cp\u003E是来自班级的消息。\u003C\u002Fp\u003E\u003Cp\u003E“号外号外，京都魔道大学已经向安若曦抛出橄榄枝，将提前免试录取保送！”\u003C\u002Fp\u003E\u003Cp\u003E“同时，也希望其他同学继续努力，在这最后的时间争取尽可能的提升气血值，从而去往更好的武道大学！”\u003C\u002Fp\u003E\u003Cp\u003E班主任的消息排在首位，直接令群里炸开了锅。\u003C\u002Fp\u003E\u003Cp\u003E“我去，安女神不愧是我们二班的骄傲，京都武道大学那可是我们大夏数一数二的高等学府，能够进入其中的无一不是精英，前途广大啊！”\u003C\u002Fp\u003E\u003Cp\u003E“是啊，羡慕死我们了，安女神是真正的天之娇女，我哪怕有安女神十分之一的优秀，都不至于担忧明天的气血测试。”\u003C\u002Fp\u003E\u003Cp\u003E“诶，参与高考的气血阈值每年都在变动，去年是108，今年据说又要提高一点……”\u003C\u002Fp\u003E\u003Cp\u003E同学们不断述说着，有吹捧也有羡慕，更有对自己未来的担忧。\u003C\u002Fp\u003E\u003Cp\u003E毕竟只有武考，才有希望成为人上人，才不用在阶级的底层挣扎生活，才会有更高的社会地位。\u003C\u002Fp\u003E\u003Cp\u003E只是就在同学们议论纷纷的他同时。\u003C\u002Fp\u003E\u003Cp\u003E一条并不礼貌的消息进入林牧的眼帘。\u003C\u002Fp\u003E\u003Cp\u003E【王乾：说起来，林牧不是和安女神是青梅竹马吗？安女神如今提前被京都武道大学录取，我们的林牧又被哪所武道大学提前录取了？】\u003C\u002Fp\u003E\u003Cp\u003E这句话明显是讥讽。\u003C\u002Fp\u003E\u003Cp\u003E谁都知道林牧武道天赋堪忧，别说能不能过去年的气血值线，能不能达到一半都不好说。\u003C\u002Fp\u003E\u003Cp\u003E又因为大家都是同学，虽然有些人眼里或许会看不起，可摆在明面上的终归是少数。\u003C\u002Fp\u003E\u003Cp\u003E因此下方回应的人并不多，即便有，也大都是与对方的一丘之貉。\u003C\u002Fp\u003E\u003Cp\u003E林牧看着这条消息，深吸一口气，只是双拳微微一握。\u003C\u002Fp\u003E\u003Cp\u003E安若曦，邑城二中的天之娇女。\u003C\u002Fp\u003E\u003Cp\u003E同时也是他小时候的玩伴，二人自小就是邻居，生活在一个胡同里，是名副其实的青梅竹马。\u003C\u002Fp\u003E\u003Cp\u003E只是后来对方展现出过人天赋，就搬离了小区，从此二人渐行渐远……\u003C\u002Fp\u003E\u003Cp\u003E不过二人的关系仍是被他人得知，也不知是因为羡慕还是什么原因，时常有人以此攻击他。\u003C\u002Fp\u003E\u003Cp\u003E这王乾就是为首之人。\u003C\u002Fp\u003E\u003Cp\u003E“难道，我真的就只能做一个普通人，连命运都无法掌握在手中吗？任人讥讽？”\u003C\u002Fp\u003E\u003Cp\u003E林牧心中满是不甘，双拳死死握住，身为少年心中又怎么可能没有热血？\u003C\u002Fp\u003E\u003Cp\u003E现在的他，恨不得直接一拳干王乾脸上去。\u003C\u002Fp\u003E\u003Cp\u003E可他气血值低下，根本就不是对方的对手，这才是真正的现实。\u003C\u002Fp\u003E\u003Cp\u003E然而就在这个时候。\u003C\u002Fp\u003E\u003Cp\u003E一道冰冷的提示音忽然在他的脑海中响彻。\u003C\u002Fp\u003E\u003Cp\u003E【叮！恭喜宿主！】\u003C\u002Fp\u003E\u003Cp\u003E【模拟系统汲取气血值已到开启条件，人生模拟系统成功开启！】\u003C\u002Fp\u003E\u003Cp\u003E【系统已默认绑定《仙侠大世界》为模拟世界！】\u003C\u002Fp\u003E\u003Cp\u003E【您的新手礼包已到账，可免费进行一次人生模拟，请查收！】\u003C\u002Fp\u003E\u003Cp\u003E模拟系统？仙侠大世界？\u003C\u002Fp\u003E\u003Cp\u003E林牧听着脑海中的声音，随后面色狂喜。\u003C\u002Fp\u003E\u003Cp\u003E统子！\u003C\u002Fp\u003E\u003Cp\u003E统子是你吗？你终于来了吗？！\u003C\u002Fp\u003E\u003Cp\u003E林牧激动地直接从床上跳了起来，这十几年的平庸以及无可奈何，都让他心生郁结，甚至忘了自己是穿越者的身份。\u003C\u002Fp\u003E\u003Cp\u003E不过系统那句“汲取气血值已到开启条件”是什么鬼？\u003C\u002Fp\u003E\u003Cp\u003E“难道，我之所以武道天赋低到令人发指，气血值一直无法增长，是因为系统汲取的原因吗？”林牧面色微微一变，可算是找到了罪魁祸首。\u003C\u002Fp\u003E\u003Cp\u003E不过用几年平庸，去换取系统的到来。\u003C\u002Fp\u003E\u003Cp\u003E他还是愿意的。\u003C\u002Fp\u003E\u003Cp\u003E另外，这人生模拟又是个什么情况？仙侠大世界为模拟世界？\u003C\u002Fp\u003E\u003Cp\u003E还不等林牧弄清楚，一块系统的数据面板便呈现在他脑海中。\u003C\u002Fp\u003E\u003Cp\u003E【宿主：林牧！】\u003C\u002Fp\u003E\u003Cp\u003E【气血值：42！】\u003C\u002Fp\u003E\u003Cp\u003E【战法：无！】\u003C\u002Fp\u003E\u003Cp\u003E【功法：无！】\u003C\u002Fp\u003E\u003Cp\u003E【模拟点：0！】\u003C\u002Fp\u003E\u003Cp\u003E气血值，为武者强弱的体现，通常来说是气血值越强实力越强。\u003C\u002Fp\u003E\u003Cp\u003E可这也并不绝对。\u003C\u002Fp\u003E\u003Cp\u003E有些人修炼武技、战法之后，能将气血爆发出更强的威力。\u003C\u002Fp\u003E\u003Cp\u003E至于模拟点，则是模拟时所需的一种点数。\u003C\u002Fp\u003E\u003Cp\u003E通过杀戮异兽以及武者等超凡存在，就能根据死亡目标的实力高低、强弱，来获得不同数量的模拟点。\u003C\u002Fp\u003E\u003Cp\u003E只是查收了这一切的林牧，却面色显得有些苦涩，甚至有些哭笑不得。\u003C\u002Fp\u003E\u003Cp\u003E“马上就要体测了，希望目前唯一的这一次模拟机会，能够给我带来不错的收获。”\u003C\u002Fp\u003E\u003Cp\u003E“而且模拟人生之后，我又究竟会获得什么呢？”\u003C\u002Fp\u003E\u003Cp\u003E林牧轻声说着，眼神中带着好奇与期待之意，因为这或许将会是他逆天改命的一次机会。\u003C\u002Fp\u003E\u003Cp\u003E也是目前，唯一的机会。\u003C\u002Fp\u003E\u003Cp\u003E他没有犹豫，直接选择开启了人生模拟！\u003C\u002Fp\u003E",secondChapterId:76334803,latestChapterId:77419224,latestChapterName:"诛杀林牧！",latestLevel:b,latestDateMsg:"2024-05-16 22:13:27",todayUpdateNum:a,mengZhuNum:a,bookBaikeId:a,naodongIndex:d,isFavorite:d,isfemale:a},authorInfo:{authorId:h,pseudonym:g,authorImage:"https:\u002F\u002Fstatic.zongheng.com\u002Fuserimage\u002F72\u002F70\u002F7270bcd9dc8b32bc1eb7d9506de0e996V1_120_120.png",authorType:b,godMark:a,godMarkUrl:c,authorLevel:b,authorLevelUrl:"https:\
