evice-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:k,bookName:l,pseudonym:g,cateFineId:m,cateFineName:h,cateId:8477,cateName:"都市高武",firstLetter:"B",authorId:i,createTime:"2024-02-20 18:03:12",bookCover:n,authorization:4,level:b,serialStatus:b,description:"沙盘之内为主宰，沙盘之外我无敌！\u003Cbr\u003E王天野是名大二学生。意外淘到一块沙盘，里面藏着一片修仙的大陆，并附赠一个系统，还没等他高兴，系统就给了两个选择：要么嘎！要么养！\u003Cbr\u003E于是，他只能选择养活这片大陆，人生巅峰也从此开始。\u003Cbr\u003E作为沙盘的主人，他不但要养活沙盘，与里面的妖类和门派斗智斗勇，还要养活现实中的自己和家人；平静的生活自此变得忙碌，但他依然乐此不疲。\u003Cbr\u003E沙盘里的他就像是在玩开挂的游戏，现实中又是一个低调的学生：两种生活看似极端，却令他陶醉其中，不能自拔！",totalWords:567472,keyWordList:["学生","仙侠",h,"爽文","修仙"],totalRecCount:a,weekRecCount:a,totalClick:32,continueRead:d,readChapterId:o,firstChapterId:o,firstChapterName:"第1章 地主家没余量了",firstChapterContent:"\u003Cp\u003E“靠，又要吃土了！浪费老纸表情！”\u003C\u002Fp\u003E\u003Cp\u003E真雕工业区的出租房内，王天野看了一眼比自己脸还干净的只猫宝，泄气地骂道。\u003C\u002Fp\u003E\u003Cp\u003E今天是王天野被辞退的第四天。他这个月的房租还没交，唯一剩下的几百生活费还被讹了，眼下就只剩几盒泡面度日，连个卤蛋都加不起。\u003C\u002Fp\u003E\u003Cp\u003E“心好累啊！地主家没余量了！”\u003C\u002Fp\u003E\u003Cp\u003E王天野无奈地接受现实，疲惫地望向破沙发前的二手折叠桌。此时折叠桌上，正被一个丑不拉几的沙盘占得满满当当。\u003C\u002Fp\u003E\u003Cp\u003E就是这沙盘，榨干了他紧巴巴的生活费，让他落得身无分文。\u003C\u002Fp\u003E\u003Cp\u003E但他却不后悔。\u003C\u002Fp\u003E\u003Cp\u003E因为这个沙盘不是一般的沙盘，上面生存着一群智慧生命；短短七天的时间，他已经熬死了里面两批智慧生命。他也曾试图伸手去取，却发现自己手一伸进去，就会碰死一大片，导致他再也不敢轻举妄动。\u003C\u002Fp\u003E\u003Cp\u003E目睹了沙盘内生物从单细胞进化成智慧生命，又看着他们从原始社会发展至超级文明，然后又一次次突破文明壁垒，十分过瘾。\u003C\u002Fp\u003E\u003Cp\u003E美中不足的是，每每都看着他们将要踏入一个未知高度时，整个文明突然化作一点亮光，在他眼前消失。\u003C\u002Fp\u003E\u003Cp\u003E这种感受就如同在看一部精彩大片，看到高潮时，突然要你充值会员。换粗俗一点的比喻：当两人正在激烈那啥时，却被硬生生吓断。话说到这里，懂的人都懂！\u003C\u002Fp\u003E\u003Cp\u003E很无奈！\u003C\u002Fp\u003E\u003Cp\u003E沙盘里所发生的事，实在太过匪夷所思，太反人类；就算百般不爽，王天野也只能默默承受，不可与外人道哉。\u003C\u002Fp\u003E\u003Cp\u003E当然，最主要原因还是怕被人当成精神病患者，送进三院。\u003C\u002Fp\u003E\u003Cp\u003E为了搞明白沙盘奥秘，王天野如同得了魔怔，废寝忘食地观察，这也耽误了他很多事。\u003C\u002Fp\u003E\u003Cp\u003E首先就是被干了三个月临时工的古建修复公司辞退。若不是指望毕业后留在这家公司，他也不会狠下心租这个房子；一个月一千的租金，抵得上他一个半月的生活费了。\u003C\u002Fp\u003E\u003Cp\u003E如今被辞退，就少了每月一千五的工资，加上口袋空空……现在别说这个月房租了，他就连填饱肚子都成问题。\u003C\u002Fp\u003E\u003Cp\u003E其次，因为他开学以后连续旷课，大前天被导师逮住臭骂一顿，并被狠狠警告了一次。\u003C\u002Fp\u003E\u003Cp\u003E然而这些都动摇不了王天野的探知欲，依旧沉迷于对沙盘的研究不能自拔。\u003C\u002Fp\u003E\u003Cp\u003E恰好这两天碰到中秋国庆连假，他连房门都没出，窝在出租屋内死盯着沙盘已经两天两夜没合眼，结果——还是研究了个寂寞。\u003C\u002Fp\u003E\u003Cp\u003E就在得到沙盘第七天晚上12:00整时，王天野终于熬没了里面的第二批生命，疲惫又失落地顶着熊猫眼，如同死狗瘫在沙发上，沉沉睡去。\u003C\u002Fp\u003E\u003Cp\u003E睡梦中，王天野正在流着哈喇子。那表情，用“猥琐”都不足以形容。\u003C\u002Fp\u003E\u003Cp\u003E具体是啥梦？懂的人都懂！\u003C\u002Fp\u003E\u003Cp\u003E美梦正酣时，一个纯净的萝莉音，在他耳边响起：“恭喜主人，成功激活‘一片大陆’眷养系统！”\u003C\u002Fp\u003E\u003Cp\u003E“系统？什么系统？”他一声梦呓，随即猛地惊醒。\u003C\u002Fp\u003E\u003Cp\u003E“谁？”\u003C\u002Fp\u003E\u003Cp\u003E他大叫一声，猛地从旧沙发上坐起，借着窗外依稀阳光，开始环顾四周。而这空荡荡的小客厅，除了一览无余的地板，只剩孤零零的自己。\u003C\u002Fp\u003E\u003Cp\u003E紧接着王天野发现沙盘，又又又开始发生诡异的变化。随即他抠掉眼角碍事的眼屎，穿起拖鞋就是一阵臭骂：“靠，又来！你踏马的就不能等等吗？……就不能让我补个回笼觉吗？……淦，忘了今天是月底，等下包租婆别又找上门！”\u003C\u002Fp\u003E\u003Cp\u003E恰在此时，一阵急促的敲门声响起，门外还传来女房东凶巴巴的声音：“王天野，我知道你在里面，快给老娘开门！”\u003C\u002Fp\u003E\u003Cp\u003E真是怕什么来什么。\u003C\u002Fp\u003E\u003Cp\u003E房门打开，一阵熏人的味道扑鼻而来，闹得房东赶紧捂住鼻子，一脸厌恶道：“王天野，我告诉你……今天你若是再不把房租交了，就给老娘搬出去！”\u003C\u002Fp\u003E\u003Cp\u003E“能不能再宽限几天……”王天野苦着脸求情道，却被无情打断。\u003C\u002Fp\u003E\u003Cp\u003E“几天又几天，这都是你这个月说的第几次了！……今天是最后一天……你必须马上交，否则就给我搬走！没钱就别住……哼，想住免费的可以睡大街当乞丐呀……穷逼一个。”\u003C\u002Fp\u003E\u003Cp\u003E房东刻薄的话直接触及王天野敏感的神经，他暴脾气一下子就上来，举着拳头怒指房东：“嘴巴放干净点！说谁乞丐？”\u003C\u002Fp\u003E\u003Cp\u003E此时王天野的反应确实很反常。但如果知道了他的家境，也就能够理解他为何有如此反应。\u003C\u002Fp\u003E\u003Cp\u003E王天野自幼丧母，懦弱的父亲十多年前又为他找了个后妈，还生了个脑瘫妹妹……但这些都不重要；重要的是这个家基本上是名存实亡，家里整天乱哄哄，生活几乎是有上顿没下顿。在这样的家庭环境下，难免会造就畸形的性格。\u003C\u002Fp\u003E\u003Cp\u003E不过王天野聪明。他很少回家，基本都是躲到外公外婆家；所以不但不自卑，反而激发出强烈的傲骨。\u003C\u002Fp\u003E\u003Cp\u003E女房东看到原本文质彬彬的王天野突然暴走，有些害怕他会突然动手，于是放软态度：“老娘就再给你三天时间，10月3号我会再来，要是到时还不交，那就……”\u003C\u002Fp\u003E\u003Cp\u003E“行，3号就3号！”王天野正在气头上，脑子一热，不管不顾就说出这句话。\u003C\u002Fp\u003E\u003Cp\u003E说完他就后悔了。因为他现在是啥收入都没了；别说给他四天，就是再给他一月半月，都未必能交得起房租。\u003C\u002Fp\u003E\u003Cp\u003E房东走后，王天野懊恼地关上门，失魂落魄朝沙盘挪去，安慰自己道：“如今只能走一步看一步，不行就只能悄悄搬走！”随后揉了揉干涩的眼睛，又开始紧盯着沙盘。\u003C\u002Fp\u003E\u003Cp\u003E这是他第三次见证沙盘轮回。第一次见证，是在找到沙盘的时候，也正是因为这个发现，他才下定决心花掉仅剩的生活费；第二次是带回沙盘的第四天。\u003C\u002Fp\u003E\u003Cp\u003E此时沙盘里的情形正在转变，沙盘内已经被一团浓稠的黑雾占据。\u003C\u002Fp\u003E\u003Cp\u003E就在王天野刚靠近时，上一秒沙盘里笼罩的还是黑雾；而下一秒，黑雾中就亮起斑驳光点；随即黑雾消散，光点膨胀，化为一道道氤氲缭绕的虚影。\u003C\u002Fp\u003E\u003Cp\u003E须臾间，虚影再变，一个个类似胚胎的东西浮现。\u003C\u002Fp\u003E\u003Cp\u003E“咦？这次改创意了？……是要直接出现生命吗？”\u003C\u002Fp\u003E\u003Cp\u003E如此变化，王天野除了好奇还有慌张，双手合十对着沙盘虔诚地祈求：“这回可得慢一点，一定要超慢超慢......别又搞得我眼花缭乱，老有‘快男’的感觉！”\u003C\u002Fp\u003E\u003Cp\u003E突然，梦中的萝莉音突兀出现：“别再看啦！再看又要没啦！”\u003C\u002Fp\u003E\u003Cp\u003E“哎呦，妈呀！吓死喵了！”\u003C\u002Fp\u003E\u003Cp\u003E王天野被吓一激灵，惊叫的同时，也好奇是谁家的孩子偷跑进来。他猫下腰去察看折叠桌底，用自认为和气的语气说：“出来吧！小萝……哦不，小朋友，哥哥兜里有糖！……咦？……人呢？”\u003C\u002Fp\u003E\u003Cp\u003E“唔……丢死系统了！……本系统怎么会摊上你这么个主？”萝莉音的语气中透着淡淡的忧伤与失望。\u003C\u002Fp\u003E\u003Cp\u003E王天野顿时又惊又喜，立马站直，眼睛四处乱瞄，激动得语无伦次：“系统？……你是什么系统？……诶呀！搞错重点了……我差点被你吓出心脏病……啊呸，又搞错了……请问你有啥功能？包括那啥……”\u003C\u002Fp\u003E\u003Cp\u003E暗处的系统已是满头青筋，无情打断：“检测到主人的语言功能出现紊乱，本系统决定为主人进行电击治疗......电击将在三秒后执行！”\u003C\u002Fp\u003E\u003Cp\u003E“别别……开玩笑、开玩笑！”王天野秒怂，赶紧调整状态，收起吊儿郎当的心态，一本正经地问，“系统，这沙盘是怎么回事？”\u003C\u002Fp\u003E\u003Cp\u003E“哼！由于主人的漠视，已经导致‘一片大陆’出现两次夭折，还白嫖两颗大陆成果。”\u003C\u002Fp\u003E\u003Cp\u003E“没有啊！……我可没有，你可不能乱冤枉我！”王天野感觉自己被冤枉了，矢口否认，嗓门不由提高。\u003C\u002Fp\u003E\u003Cp\u003E可系统却笃定说：“还说没有！……9月28号晚上，你是不是看到里面飞出的光点？还有昨天晚上的光点……那都是‘一片大陆’文明发展到巅峰的成果。”\u003C\u002Fp\u003E\u003Cp\u003E“本系统郑重警告主人：沙盘中大陆文明的走向若再次夭折，主人轻则残废，重则丧命……请好自为之！”\u003C\u002Fp\u003E\u003Cp\u003E王天野还在消化系统说的话，突然听到最后说的这段，仿佛腰子被捅了一刀；而且他还听出系统这是要撂挑子走人，赶紧甩掉思绪，挽留道：“不会的不会的！……系统你先别走，跟我解释下呗！”\u003C\u002Fp\u003E\u003Cp\u003E只是系统态度很坚决：“没什么好解释的。本系统现在很生气，不想解释！等你改过自新后再说。”\u003C\u002Fp\u003E\u003Cp\u003E系统消失了，王天野犯愁了。\u003C\u002Fp\u003E\u003Cp\u003E但一想到刚被系统无厘头的责备与冤枉，他的暴脾气就随之上来，也学着撂摊子：“管你呢！……什么大陆不大陆，关我屁事！”\u003C\u002Fp\u003E\u003Cp\u003E王天野抱怨完，如同往常去阳台的厨房泡了盒面。\u003C\u002Fp\u003E\u003Cp\u003E可是面好了，天却黑了。\u003C\u002Fp\u003E",secondChapterId:76910943,latestChapterId:77352289,latestChapterName:"第231章 结束这场可笑阴谋（结局）",latestLevel:b,latestDateMsg:"2024-05-08 08:11:00",todayUpdateNu
