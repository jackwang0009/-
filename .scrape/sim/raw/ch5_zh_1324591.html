=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8415,cateName:"东方玄幻",firstLetter:"C",authorId:h,createTime:"2024-04-20 03:12:04",bookCover:n,authorization:4,level:b,serialStatus:b,description:"剑阁之殇引发灭门惨案，绝境逢生的少年，领悟绝世剑法，持剑一头闯进这天道浩劫！\u003Cbr\u003E纵剑千里，斩苍穹，破天道！重开天门！",totalWords:644197,keyWordList:["剑道","全能","争霸","玄幻","爽文"],totalRecCount:a,weekRecCount:a,totalClick:344,continueRead:d,readChapterId:o,firstChapterId:o,firstChapterName:"第一章 绝境少年",firstChapterContent:"\u003Cp\u003E天玄大陆，云澜城。\u003C\u002Fp\u003E\u003Cp\u003E“叶家主恭喜啊！你家公子年纪轻轻就有如此成就，日后必然飞黄腾达，一飞冲天！”\u003C\u002Fp\u003E\u003Cp\u003E“果然是虎父无犬子，叶家主你作为我们云澜城唯一一个观海境高手！现在你儿子小小年纪就突破洞府境，看来这日后的云澜城定然是你叶家说的算了！”\u003C\u002Fp\u003E\u003Cp\u003E叶家府邸内人头攒动。\u003C\u002Fp\u003E\u003Cp\u003E今日是叶家家叶厚德儿子叶轩的成年礼，也是他突破洞府境的大喜之日！\u003C\u002Fp\u003E\u003Cp\u003E叶家作为云澜城四大家族之首！\u003C\u002Fp\u003E\u003Cp\u003E几乎全城有头有脸的人物都过来表示庆祝。\u003C\u002Fp\u003E\u003Cp\u003E“大家说笑了！”\u003C\u002Fp\u003E\u003Cp\u003E叶厚德神色谦虚的说道：“我家那不争气的儿子，哪有你们说的这么夸张！不过才洞府境而已，对于练气之路不过才刚刚开始！”\u003C\u002Fp\u003E\u003Cp\u003E“哎！”\u003C\u002Fp\u003E\u003Cp\u003E众人笑着说道：“叶家主你就不要谦虚了！放眼整个天玄大陆，十八岁就能达到洞府境的人哪个不是万里挑一的天才？”\u003C\u002Fp\u003E\u003Cp\u003E“只要你宝贝儿子认真修炼，想要达到观海境不还是手到擒来！”\u003C\u002Fp\u003E\u003Cp\u003E一群人凑在叶厚德身旁纷纷吹捧。\u003C\u002Fp\u003E\u003Cp\u003E满眼都是羡慕之色。\u003C\u002Fp\u003E\u003Cp\u003E天玄大陆以炼气士为尊。\u003C\u002Fp\u003E\u003Cp\u003E炼气士又分洞府境、指玄境、观海境、玉璞境和仙人境！\u003C\u002Fp\u003E\u003Cp\u003E传闻到了仙人境就可羽化成仙，登入仙门！\u003C\u002Fp\u003E\u003Cp\u003E但天玄大陆千年之余还从未有人到达过仙人境。\u003C\u002Fp\u003E\u003Cp\u003E哪怕是玉璞境都寥寥无几！\u003C\u002Fp\u003E\u003Cp\u003E常人但凡能达到观海境就可独霸一方！开山立派！\u003C\u002Fp\u003E\u003Cp\u003E毫不夸张的讲。\u003C\u002Fp\u003E\u003Cp\u003E能达到观海境那就是无数人一辈子的追求！\u003C\u002Fp\u003E\u003Cp\u003E“对了叶家主，你儿子呢？他的生日宴怎么不见他的踪影？”\u003C\u002Fp\u003E\u003Cp\u003E“说的是啊，今天他才是主角啊！”\u003C\u002Fp\u003E\u003Cp\u003E“叶家主赶快让你宝贝儿子出来，让大家伙好好看看这天之骄子！”\u003C\u002Fp\u003E\u003Cp\u003E闻言。\u003C\u002Fp\u003E\u003Cp\u003E叶厚德发出了爽朗的笑声，“我已经让下人通知轩儿了，估计很快就会过来了！大家稍安勿躁！”\u003C\u002Fp\u003E\u003Cp\u003E“家主大事不好，少爷他出事了！在东街和人打起来了！”\u003C\u002Fp\u003E\u003Cp\u003E可就在这时，一个叶家仆人急冲冲的跑了进来。\u003C\u002Fp\u003E\u003Cp\u003E“什么？”\u003C\u002Fp\u003E\u003Cp\u003E听到这话。\u003C\u002Fp\u003E\u003Cp\u003E叶厚德眉头紧皱，急忙大步流星走出府邸。\u003C\u002Fp\u003E\u003Cp\u003E……\u003C\u002Fp\u003E\u003Cp\u003E“不愧是剑阁余孽的后辈，小小年纪就有如此实力！还真是让人刮目相看啊！”\u003C\u002Fp\u003E\u003Cp\u003E云澜城东街。\u003C\u002Fp\u003E\u003Cp\u003E只见数十位身着白袍的男子将叶轩围堵起来。\u003C\u002Fp\u003E\u003Cp\u003E为首的白衣男子手持一柄青色长剑，一脸戏谑的打量着浑身是血的叶轩。\u003C\u002Fp\u003E\u003Cp\u003E“什么剑阁余孽？我根本就不知道你在说什么！”\u003C\u002Fp\u003E\u003Cp\u003E叶轩捂着胸口，脸上露出了痛苦的神色。\u003C\u002Fp\u003E\u003Cp\u003E“呵呵！”\u003C\u002Fp\u003E\u003Cp\u003E白衣男子冷笑了两声，“死到临头还在这死鸭子嘴硬！我奉劝你赶快把沧海剑诀交出来，要不然……我会让你活着比死了还要难受！”\u003C\u002Fp\u003E\u003Cp\u003E“呸！”\u003C\u002Fp\u003E\u003Cp\u003E叶轩冲着白衣男子吐了口痰，一脸不屑的说道：“要打就打，说这么多废话干什么！”\u003C\u002Fp\u003E\u003Cp\u003E“我告诉你，我从来就没听说过什么沧海剑诀！”\u003C\u002Fp\u003E\u003Cp\u003E白衣男子看着粘在自己衣角的口水，眯着眼睛，身上更是散发出一股渗人的戾气。\u003C\u002Fp\u003E\u003Cp\u003E“你这是找死！”\u003C\u002Fp\u003E\u003Cp\u003E说着，白衣男子浑身上下突然爆发出一股强大的气场！\u003C\u002Fp\u003E\u003Cp\u003E这气场压迫的叶轩近乎喘不过气来！\u003C\u002Fp\u003E\u003Cp\u003E好强！\u003C\u002Fp\u003E\u003Cp\u003E叶轩稳住身形，看着白衣男子的眼神中充满了震撼。\u003C\u002Fp\u003E\u003Cp\u003E这白衣男子的实力恐怕比自己的父亲还要强悍！\u003C\u002Fp\u003E\u003Cp\u003E他们究竟是什么人！\u003C\u002Fp\u003E\u003Cp\u003E“住手！”\u003C\u002Fp\u003E\u003Cp\u003E可就在这千钧一发之际。\u003C\u002Fp\u003E\u003Cp\u003E不远处传来了叶厚德愤怒的声音，而他的身后更是跟着不少人。\u003C\u002Fp\u003E\u003Cp\u003E只是他们见到白衣男子的时候，纷纷停下来自己的脚步！\u003C\u002Fp\u003E\u003Cp\u003E“这是天道盟神卫的碧玉剑！夏子清！他可是观海境的高手啊！”\u003C\u002Fp\u003E\u003Cp\u003E“我的天啊，叶家究竟是做了什么事，竟然能让天道盟把神卫给派出来！”\u003C\u002Fp\u003E\u003Cp\u003E人群中不乏有见多识广之人。\u003C\u002Fp\u003E\u003Cp\u003E一下子就认出了来者的身份。\u003C\u002Fp\u003E\u003Cp\u003E“呦呵，这不是叶家主吗！”\u003C\u002Fp\u003E\u003Cp\u003E夏子清瞥了一眼怒不可遏的叶厚德，冷笑道：“早就听闻今日是你儿子的生日宴，这不，我正打算给你备一份厚礼呢，可没想到你竟然这么快就过来了！”\u003C\u002Fp\u003E\u003Cp\u003E“父亲！你别听他胡说八道！”\u003C\u002Fp\u003E\u003Cp\u003E叶轩怒斥道：“这群人是铁了心要找我们叶家的麻烦！”\u003C\u002Fp\u003E\u003Cp\u003E叶厚德看着浑身是伤痕的叶轩，满眼心疼，身上同样爆发出一股不弱于夏子清的气息。\u003C\u002Fp\u003E\u003Cp\u003E“我不想和你废话！把我儿子给我！”\u003C\u002Fp\u003E\u003Cp\u003E“哦？”\u003C\u002Fp\u003E\u003Cp\u003E夏子清诧异的看了一眼叶厚德，讥笑道：“真是没想到，叶家主的实力竟然如此强悍！剑阁余孽了不起啊！”\u003C\u002Fp\u003E\u003Cp\u003E“什……什么？剑阁余孽？”\u003C\u002Fp\u003E\u003Cp\u003E“这不可能吧！剑阁之殇至今已经百年之久，这叶家主不过才四十多岁，他怎么可能是剑阁余孽！”\u003C\u002Fp\u003E\u003Cp\u003E“是啊，这你们是不是搞错了？”\u003C\u002Fp\u003E\u003Cp\u003E众人不约而同的看向了夏子清。\u003C\u002Fp\u003E\u003Cp\u003E夏子清轻哼了一声，“根据我们天道盟调查！叶厚德乃是当年剑阁余孽叶静青的后人！”\u003C\u002Fp\u003E\u003Cp\u003E“嘶！”\u003C\u002Fp\u003E\u003Cp\u003E一听这话，在场所有人纷纷倒吸了一口凉气，他们看着叶厚德的眼神中也是充满了恐惧。\u003C\u002Fp\u003E\u003Cp\u003E“尔等要是不想牵连其中，还请尽快退去！否则将被我们一视同仁！”\u003C\u002Fp\u003E\u003Cp\u003E夏子清手中利剑轻轻一挥。\u003C\u002Fp\u003E\u003Cp\u003E嗡嗡嗡！\u003C\u002Fp\u003E\u003Cp\u003E清脆的剑鸣声。\u003C\u002Fp\u003E\u003Cp\u003E听得在场所有人不寒而栗！\u003C\u002Fp\u003E\u003Cp\u003E这就是观海境的实力！\u003C\u002Fp\u003E\u003Cp\u003E“这叶家是当年剑阁余孽……真的假的？”\u003C\u002Fp\u003E\u003Cp\u003E“说不定是真的呢，其他家族一辈子恐怕都出不了一个观海境的高手，可叶家才短短数十年就有如此成就，而且他儿子小小年纪就达到了洞府境，说不定正是修炼了什么奇门异法！”\u003C\u002Fp\u003E\u003Cp\u003E“别管真的假的，我们还是快走吧，今日叶家喜宴恐怕……要变成灭门之灾了！我们还是要赶快和他们划清界限才行啊！”\u003C\u002Fp\u003E\u003Cp\u003E“对对对，天道盟的人都这么说了，这事恐怕错不了！我们还是赶快走吧！”\u003C\u002Fp\u003E\u003Cp\u003E“万一天道盟把我们也当成一起的，那后果可真是不堪设想啊！”\u003C\u002Fp\u003E\u003Cp\u003E几乎转眼之际。\u003C\u002Fp\u003E\u003Cp\u003E跟在叶厚德身后的众人纷纷退避三舍，生怕会受到牵连。\u003C\u002Fp\u003E\u003Cp\u003E“叶厚德赶快把沧海剑诀交出来！否则……我现在就宰了你的宝贝儿子！”\u003C\u002Fp\u003E\u003Cp\u003E等人都走了差不多了，夏子清趾高气昂的开口说道。\u003C\u002Fp\u003E\u003Cp\u003E“你们搞错了！我不知道什么沧海剑诀！”\u003C\u002Fp\u003E\u003Cp\u003E“今日要么把我儿子还给我，我放你们离开！要么……你们全都死在这！”\u003C\u002Fp\u003E\u003Cp\u003E叶厚德说话的声音不大，但是却掷地有声，让人不敢有丝毫小觑。\u003C\u002Fp\u003E\u003Cp\u003E“哈哈哈哈！”\u003C\u002Fp\u003E\u003Cp\u003E面对叶厚德的威胁，夏子清却发出了刺耳的嘲讽声，手中长剑凭空一挥。\u003C\u002Fp\u003E\u003Cp\u003E一股剑气直接刺向了身旁的叶轩。\u003C\u002Fp\u003E\u003Cp\u003E噗嗤！\u003C\u002Fp\u003E\u003Cp\u003E剑气直接穿透了叶轩的身子。\u003C\u002Fp\u003E\u003Cp\u003E噗！\u003C\u002Fp\u003E\u003Cp\u003E叶轩痛苦的倒在了地上，口吐鲜血！\u003C\u002Fp\u0
