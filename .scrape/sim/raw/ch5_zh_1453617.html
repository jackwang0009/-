th=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,minimal-ui",name:"viewport"}]},detail:{detailBook:{book:{bookId:j,bookName:k,pseudonym:g,cateFineId:l,cateFineName:m,cateId:8477,cateName:"都市高武",firstLetter:"G",authorId:h,createTime:"2025-08-20 11:02:43",bookCover:n,authorization:4,level:a,serialStatus:d,description:"穿越异世，魔窟入侵！\u003Cbr\u003E每个魔窟都代表着一个位面种族，本以为人族在劫难逃，就此灭亡，但地窟出现的同时武者也应运而生！\u003Cbr\u003E普通人林风本以为会继续平凡下去，但获得的【轮回修仙模拟器】却让他不再平凡。\u003Cbr\u003E每次模拟结束他都可以随机抽取一项东西带到主世界！\u003Cbr\u003E抽取体质万古长青体，成就不死真身！\u003Cbr\u003E抽取法器玄天斩妖剑，一剑开天门！\u003Cbr\u003E抽取功法焚天战帝诀，一脚碎星河！\u003Cbr\u003E······\u003Cbr\u003E无数年后，林风率领统御的万族降临修仙世界，让高高在上的仙人也感受一下来自高武世界的震撼！",totalWords:o,keyWordList:["热血","杀伐果断","穿越","灵气复苏","金手指"],totalRecCount:a,weekRecCount:a,totalClick:408,continueRead:c,readChapterId:p,firstChapterId:p,firstChapterName:"第1章修仙模拟器",firstChapterContent:"\u003Cp\u003E“嘶！怎么头还是那么痛啊！”\u003C\u002Fp\u003E\u003Cp\u003E林风捂着头缓缓从床上爬起，穿越前的记忆依然时不时的在脑海中浮现，记得那是一个深夜，走在马路上的他突然感受到一阵刺眼的强光，随着而来的就是震耳欲聋的鸣笛声，一个硕大的带着红色的油漆的“怪兽”呼啸间眨眼来到了面前。\u003C\u002Fp\u003E\u003Cp\u003E没有痛苦，甚至连任何感觉都没有，等他苏醒的时候就已经附身在了这位跟他同名同姓的“高中生”身上。\u003C\u002Fp\u003E\u003Cp\u003E这本来是一件值得开心的好事，重回高中，重回年轻，未来就有无限可能，但随后让他没有想到的是，这个世界已经不是原来那个世界了。\u003C\u002Fp\u003E\u003Cp\u003E“林风还不快点，马上就要上课了！”\u003C\u002Fp\u003E\u003Cp\u003E熟悉的声音从耳边响起，这是他的好舍友肖强，两人是要好的同桌，认识已经好多年了。\u003C\u002Fp\u003E\u003Cp\u003E头顶上暗黄的油灯被两人走动时带起的微风吹的不停摇曳，这是一个只能容纳两人睡觉的帐篷，作为了林风他们的临时宿舍。\u003C\u002Fp\u003E\u003Cp\u003E掀开帐帘，十几个形状相同的帐篷映入眼帘，不断有学生从帐篷中出来，聚集到前方的空地中\u003C\u002Fp\u003E\u003Cp\u003E林风环顾四周，目光所及之处是雄壮的城墙，城墙足有百米之高，如同一个凶猛的巨兽，给人极大的压迫感，上面站满了身穿铠甲的士兵。\u003C\u002Fp\u003E\u003Cp\u003E“邢教官，武道三十八班人员已全部到到期！请您指示！”\u003C\u002Fp\u003E\u003Cp\u003E“同学们！今天我们继续学习联邦第九套锻体呼吸法，大家跟着我的动作一步步模仿······”一个光着膀子，肌肉发达的壮汉来到了人们的面前，声音如钟声那般宏大。\u003C\u002Fp\u003E\u003Cp\u003E众人见状连忙跟着做了起来，肖强见林风还在愣神，赶紧踢了一脚，轻声说道：“风哥！还在发呆什么！这可不比上面，这里可是地窟，武道教官如果发现你发呆的话，你可就惨了！”\u003C\u002Fp\u003E\u003Cp\u003E“武道”，“地窟”，“锻体呼吸法”等等熟悉而又陌生的词语出现在了林风的脑海中，他再次认识到这方世界的不一样。\u003C\u002Fp\u003E\u003Cp\u003E“联邦1000年，凶兽地窟降临，兽潮涌出，联邦紧急调用了核弹，才遏制住了兽潮！”\u003C\u002Fp\u003E\u003Cp\u003E“联邦1256年，诡怪地窟降临”\u003C\u002Fp\u003E\u003Cp\u003E“联邦1356年，妖精地窟降临”\u003C\u002Fp\u003E\u003Cp\u003E“······”\u003C\u002Fp\u003E\u003Cp\u003E虽然从地窟中的生物一出来就被联邦用杀伤性武器给消灭了，但由于人类武器无法在地窟中使用，一进入就会全部失去效果，这导致人类只能在外面被动防守，任由怪物屠戮。\u003C\u002Fp\u003E\u003Cp\u003E随着时间的退役，越来越多的地窟出现，本以为人族要惨遭灭绝，但好在天无绝人之路，地窟出现的同时也散发出了一种名为“元气”的物质，人族利用元气掌握了强大的力量，终于能在地窟里面击败怪物，而掌握这种超凡力量的人联邦将他们称之为武者！\u003C\u002Fp\u003E\u003Cp\u003E拥有武者后，联邦终于打进了地窟，在地窟里面建立了防线，人族的历史才得以延续下去。\u003C\u002Fp\u003E\u003Cp\u003E众人练完一整套锻体呼吸法后，终于开始了吃饭。\u003C\u002Fp\u003E\u003Cp\u003E此刻换了一位面容清秀的老师，此人正是武道三十八班的班主任——张华。\u003C\u002Fp\u003E\u003Cp\u003E“大家一定要珍惜这次进入地窟的机会，好好的修炼第九套锻体呼吸法，学校将我们这些武道学生带进来也不容易，你们吃的这些可都是地窟内生长的药材，你们不知道···”\u003C\u002Fp\u003E\u003Cp\u003E肖强表现出了跟正常高中生一样的叛逆：“老班又在讲大道理，还不如多给我整点吃的东西呢？”\u003C\u002Fp\u003E\u003Cp\u003E林风无心搭理他，因为他将注意力全部都放在了脑海中的“游戏”上面！这个\u003C\u002Fp\u003E\u003Cp\u003E没错！就是游戏，这个游戏就是他穿越时候获得的金手指！\u003C\u002Fp\u003E\u003Cp\u003E他在穿越之初偶然间发现脑海中竟然有一个小游戏，只需要集中意识便可以进入操控游戏，同时个人也不会受到影响，就跟脑子里面塞了个手机一样。\u003C\u002Fp\u003E\u003Cp\u003E【轮回修仙模拟器】\u003C\u002Fp\u003E\u003Cp\u003E【能量充足，可进行模拟】\u003C\u002Fp\u003E\u003Cp\u003E看着这几个大字，林风露出了喜悦的笑容：“终于又到了可以开始模拟，这次希望运气能好一些，是一个拥有灵根的角色！”\u003C\u002Fp\u003E\u003Cp\u003E【随着一声嘹亮的啼哭，你出生在青云山炼气小族李家！】\u003C\u002Fp\u003E\u003Cp\u003E林风瞪大了眼睛，这次的运气显然超出了他的预料。\u003C\u002Fp\u003E\u003Cp\u003E从游戏的名字就可以猜出它是个模拟器，之前开始的角色都是农家普通弟子，即使自己为用心规划也只是一个普通人，既然游戏的名字带有“修仙”二字，那肯定是要修仙的嘛！\u003C\u002Fp\u003E\u003Cp\u003E然后这些人全部死在了寻仙访道的路人，不是遭遇土匪劫杀，就是遇到猛兽袭击，几次都是这样，一直没有成功。\u003C\u002Fp\u003E\u003Cp\u003E“这次终于让我遇到好机会了，我一定要把握住！”\u003C\u002Fp\u003E\u003Cp\u003E【父母给你取名李念之，一岁走路，二岁熟记诗词百首，三岁聪慧过人，与成人无异！族长闻听，特前来观之，送予诸多灵药灵植，笑容拂面而去】\u003C\u002Fp\u003E\u003Cp\u003E这些都是林风特意展现出来的，就是为了吸引整个家族的注意，看看能不能搞点提升自己资质的东西。\u003C\u002Fp\u003E\u003Cp\u003E但随后他认识到了青云李家只是一个普通的炼气小族，最强之人族长李立德也才炼气七层，哪里能找到这样的天材地宝。\u003C\u002Fp\u003E\u003Cp\u003E【六岁，测试灵根，天赋觉醒！觉醒时众多族人将目光集于你一身，你心情紧张地将手放在了测灵法器上】\u003C\u002Fp\u003E\u003Cp\u003E【火，木，土，水三色！四灵根！】\u003C\u002Fp\u003E\u003Cp\u003E【能量耗尽，模拟结束】\u003C\u002Fp\u003E\u003Cp\u003E画面到了这里戛然而止，林风从轮回修仙模拟游戏中苏醒过来，游戏里面过去了六年，现实才过去了一会儿功夫。\u003C\u002Fp\u003E\u003Cp\u003E【模拟结束，可以从以下三个选项中带出一个】\u003C\u002Fp\u003E\u003Cp\u003E【凡物纯金铃铛（灰色）】\u003C\u002Fp\u003E\u003Cp\u003E【锦绣童衣（灰色）】\u003C\u002Fp\u003E\u003Cp\u003E【四灵根资质（深绿）】\u003C\u002Fp\u003E\u003Cp\u003E金手指的能力是每次模拟结束后，可以选择带出一样东西回到现实中，根据林风几次模拟的经验，能带出的东西包括属于模拟角色的任何事物，简单到一粒尘土，神秘到角色的一两年寿命，都在带出的范围内！\u003C\u002Fp\u003E\u003Cp\u003E“绿色品质！”\u003C\u002Fp\u003E\u003Cp\u003E看到这一幕的林风瞪大了眼睛，毫不犹豫的选择了最后一个三灵根资质，虽然他不知道灵根资质在主世界有没有作用，但这总比上面两个要好吧！\u003C\u002Fp\u003E\u003Cp\u003E他还是第一次看到这种级别的东西，之前的几次模拟全部都是灰色，最多遇到过一次白色，之后就再也没有遇到过其他品质的经济了！\u003C\u002Fp\u003E",secondChapterId:91863051,latestChapterId:93208571,latestChapterName:"第321章斩杀",latestLevel:a,latestDateMsg:"2026-01-30 22:05:40",todayUpdateNum:a,mengZhuNum:a,bookBaikeId:a,naodongIndex:c,isFavorite:c,isfemale:a},authorInfo:{authorId:h,pseudonym:g,authorImage:q,authorType:d,godMark:a,godMarkUrl:b,authorLevel:d,authorLevelUrl:"https:\u002F\u002Fstatic.zongheng.com\u002Fapp\u002Fauthorgod\u002Ftag_author_1star.png",authorBaikeId:a,hasRelationShip:c,authorBookNum:d,totalWords:o,authorUpdateDay:a,authorLatestWords:b,markShowType:d},needJump:c,jump:b,apkUrl:"https:\u002F\u002Fdl.zongheng.com\u002Fsrc\u002Fapk?bookId=1453617&bookName=%E9%AB%98%E6%AD%A6%EF%BC%9A%E6%88%91%E6%9C%89%E4%B8%80%E4%B8%AA%E4%BF%AE%E4%BB%99%E6%A8%A1%E6%8B%9F%E5%99%A8",userId:a,isLogin:c,isShowDonate:i,thisMonthDonateNum:a,thisWeekRecTicketNum:a,recTicketRankNum:a,recOfDistanceRankNum:d,mtOfDistanceRankNum:d,thisMonthRankNum:a,thisMonthTicketNum:a,last1MonthNum:8,last1MonthRankNum:a,last2MonthNum:7,last2MonthRankNum:a,showNum:d,showHonor:c,last1MonthTop1:r,last1MonthTop1Id:s,last2MonthTop1:r,last2MonthTop1Id:s,isDoubleMonthTicketOpen:c,essayActivity:e,canMonthVote:i},detailChapter:{},detailForumsInfoBookId:648873,detailBookFans:{cateFineName:m,cateFineId:l,book:{bookId:j,bookName:k,pseudonym:g,authorId:h,bookCover:n,cateId:a,cateName:b},user:e,bookFansScore:e,fansScorePage:{pageSize:10,pageNum:d,pageCount:a,itemCount:
